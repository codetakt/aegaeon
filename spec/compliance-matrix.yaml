rfc_7515_7516_jose_headers:
- id: 7515-ALG-ALLOWLIST
  section: "RFC 7515 \xA74.1.1"
  requirement: MUST
  description: JWS Protected Header alg value MUST be from the authorised allow list
  module: fstar/jose/Jose.TlvResultSpec.fst
  proof:
  - type: fstar
    file: fstar/jose/Jose.TlvResultSpec.fst
    lemma: Jose.TlvResultSpec.lemma_tlv_result_keys_in_allow_list
  - type: fstar
    file: fstar/jose/Jose.HeaderParser.Proofs.fst
    lemma: Jose.HeaderParser.lemma_parse_tlv_entries_invariants
  - type: policy
    doc: docs/policies/jose-header-policy.md
  tests:
  - crates/jose/src/tlv.rs
  - crates/jose/tests/rfc7520_vectors.rs
  ci_check: verify-fstar + cargo test -p aegaeon-jose --tests
  status: verified
  runtime_link: crates/jose/src/tlv.rs
  trace:
    kind: guard
    fstar: fstar/jose/Jose.TlvResultSpec.fst#lemma_tlv_result_keys_in_allow_list
    rust: crates/jose/src/tlv.rs#parse_jose_header_tlv
    test: crates/jose/tests/tlv_parity.rs
  notes:
  - F* lemmas prove the TLV parser never emits header keys outside the allowlist nor duplicate entries.
  - "cargo test -p aegaeon-jose --tests continuously validates regressions for both TLV and JSON paths."
- id: 7515-KID-LENGTH
  section: "RFC 7515 \xA74.1.4"
  requirement: SHOULD
  description: If kid is present it SHOULD be non-empty ASCII within configured length
    bounds
  module: fstar/jose/Jose.LowStar.fst
  proof:
  - type: fstar
    file: fstar/jose/Jose.Jws_header.fst
    lemma: Jose.Jws_header.lemma_parse_valid
  - type: policy
    doc: docs/policies/jose-header-policy.md
  tests:
  - crates/jose/src/jws.rs
  ci_check: jose-lowstar-pipeline
  status: verified
  runtime_link: crates/jose/src/json_lowstar.rs
  notes:
  - Kid bounds enforced in F* (valid_kid_string) and runtime (JwsHeader::validate)
  - Inline tests kid_validation_rejects_empty / kid_validation_rejects_too_long_or_non_ascii in crates/jose/src/jws.rs cover rejection cases for emptiness, ASCII violations, and length bounds.
- id: 7516-ENC-ALLOWLIST
  section: "RFC 7516 \xA74.1.2"
  requirement: MUST
  description: JWE enc value MUST be an approved content encryption algorithm
  module: fstar/jose/Jose.LowStar.fst
  proof:
  - type: fstar
    file: fstar/jose/Jose.Jwe_header.fst
    lemma: Jose.Jwe_header.lemma_parse_guards
  - type: policy
    doc: docs/policies/jose-header-policy.md
  tests:
  - crates/jose/tests/rfc7520_vectors.rs
  ci_check: jose-lowstar-pipeline
  status: verified
  runtime_link: crates/jose/src/json_lowstar.rs
  trace:
    kind: guard
    fstar: fstar/jose/Jose.Jwe_header.fst#lemma_parse_guards
    rust: crates/jose/src/jwe.rs#validate
    test: crates/jose/src/jwe.rs
  notes:
  - Enc allowlist currently limited to A256GCM; enforced in F* and runtime
  - Regression test_jwe_rsa_oaep_a256gcm_rejects_unsupported_enc in crates/jose/tests/rfc7520_vectors.rs keeps unsupported encodings blocked.
- id: 7515-CRIT-NOT-SUPPORTED
  section: "RFC 7515 \xA74.1.11"
  requirement: MUST
  description: crit header MUST be rejected unless all listed extensions are understood
  module: docs/policies/jose-header-policy.md
  proof:
  - type: fstar
    file: fstar/jose/Jose.Jwe_header.fst
    lemma: Jose.Jwe_header.lemma_parse_guards
  - type: fstar
    file: fstar/jose/Jose.Jws_header.fst
    lemma: Jose.Jws_header.lemma_parse_valid
  - type: policy
    doc: docs/policies/jose-header-policy.md
  tests:
  - crates/jose/src/jwe.rs
  - crates/jose/src/jws.rs
  ci_check: jose-lowstar-pipeline
  status: verified
  runtime_link: crates/jose/src/jwe.rs
  trace:
    kind: guard
    fstar: fstar/jose/Jose.Jws_header.fst#lemma_parse_valid
    rust: crates/jose/src/jws.rs#header_from_pairs
    test: crates/jose/src/jws.rs
  notes:
  - crit rejected in both JOSE header parsers; see roadmap specification refresh section
  - Inline unit tests jwe_header_rejects_crit and verify_compact_rejects_crit_header confirm crit is rejected on both TLV and JSON paths.

security_review:
- id: sec-C-1
  requirement: CRITICAL
  severity: critical
  description: Demo login path hardcoded user_id allowing identity collisions
  module: crates/server/src/web/mod.rs
  status: fixed
  fix: "Demo login now generates unique per-session subjects (demo:UUID) instead of hardcoded 'user'. Else branch uses expect() since session is guaranteed present."
  tests:
  - crates/server/src/authcode/token/tests/oidc_id_token.rs
  - crates/server/src/oidc/session/tests.rs
  notes:
  - "Token exchange was previously fixed to read user_id from bearer token metadata."
  - "Demo login path was the remaining vector; now each demo session has an isolated identity."
- id: sec-C-2
  requirement: CRITICAL
  severity: critical
  description: PKCE not reading stored challenge from AuthCodeStore
  module: crates/server/src/authcode/token.rs
  status: fixed
  fix: "PKCE verification reads stored code_challenge from AuthCodeStore."
- id: sec-H-1
  requirement: HIGH
  severity: high
  description: DPoP enforcement missing — did not return 400 on missing proof
  module: crates/server/src/middleware/dpop.rs
  status: fixed
  fix: "DPoP enforcement returns 400 on missing proof when sender constraint requires DPoP."
- id: sec-H-2
  requirement: HIGH
  severity: high
  description: Token comparison not using constant-time equality
  module: crates/server/src/util.rs
  status: fixed
  fix: "constant_time_eq used at all token and secret comparison sites."
- id: sec-H-3
  requirement: HIGH
  severity: high
  description: Admin API key authentication missing
  module: crates/server/src/web/mod.rs
  status: fixed
  fix: "Admin API key auth with SHA-256 hashing and constant_time_eq comparison."
- id: sec-M-1
  requirement: MEDIUM
  severity: medium
  description: Introspection response leaking refresh_parent metadata
  module: crates/server/src/web/token_lifecycle/introspection.rs
  status: fixed
  fix: "Introspection response construction in crates/server/src/web/token_lifecycle/introspection.rs builds the public response from BearerTokenMeta but never serializes refresh_parent. refresh_parent remains internal refresh-chain state in authcode token metadata."
  notes:
  - "refresh_parent exists in BearerTokenMeta struct for internal revocation chain tracking."
  - "The introspection handler selectively serializes only: scope, client_id, username, token_type, exp, aud, issued_at, expires_at, granted_scopes, authorization_details, auth_time, acr, sender_binding."
- id: sec-M-2
  requirement: MEDIUM
  severity: medium
  description: Token TTL not configurable
  module: crates/server/src/config.rs
  status: fixed
  fix: "Token TTLs are governed by the active database-backed runtime policy (`policy.accessTokenTtlSeconds` and `policy.refreshTokenTtlSeconds`)."
- id: sec-M-3
  requirement: MEDIUM
  severity: medium
  description: CSRF token comparison not using constant-time equality
  module: crates/server/src/web/management.rs
  status: fixed
  fix: "CSRF token comparison uses constant_time_eq."
- id: sec-M-4
  requirement: MEDIUM
  severity: medium
  description: Management session missing TTL with lazy expiration
  module: crates/server/src/web/management.rs
  status: fixed
  fix: "Session TTL with lazy expiration (default 8h via session_ttl_secs)."
# Phase 4 security findings
- id: sec-C-3
  requirement: CRITICAL
  severity: critical
  description: Federation SSRF — no URL validation, scheme check, or optional domain allowlist on entity statement fetches
  module: crates/server/src/federation.rs
  status: fixed
  fix: "HTTPS-only enforcement via validate_entity_url(), optional domain allowlist support, response size limit (256KB), reqwest hardening (timeout, connect_timeout, redirect limit), percent-encoding for subordinate URLs."
  tests:
  - crates/server/src/federation.rs
  notes:
  - "Private/non-routable IP blocking is implemented in server-side outbound URL validation and defense-in-depth HTTP clients via validate_url_not_private(), NonRoutableDnsResolver, and redirect policy checks; network/proxy controls remain an additional deployment boundary."
  - "Domain allowlist enforcement is implemented by HttpFederationFetcher::try_with_optional_allowed_domains() and redirect policy support; production full-resolve, upstream Federation metadata checks, and management cache refreshes all use the database-backed policy.federationOutboundAllowedDomains allowlist when it is non-empty. Upstream OIDC discovery/token/JWKS outbound calls use the separate database-backed policy.upstreamOutboundAllowedDomains allowlist when non-empty."
- id: sec-H-4
  requirement: HIGH
  severity: high
  description: Policy downgrade guard missing — allow_security_downgrade never checked
  module: crates/server/src/web/management.rs
  status: fixed
  fix: "detect_security_downgrade() checks security-critical booleans, protocol allowlist relaxations, outbound allowlist relaxations, temporal/size increases, and resource-risk capacity/retry increases. Returns 409 Conflict when a downgrade is detected and allow_security_downgrade is false."
- id: sec-H-5
  requirement: HIGH
  severity: high
  description: DCR bearer_matches() uses == not constant_time_eq for token comparison
  module: crates/server/src/web/dcr_registration.rs
  status: fixed
  fix: "DCR bearer admission hashes the presented token and compares the hash with crate::util::constant_time_eq in crates/server/src/web/dcr_registration.rs; management-set DCR bearer tokens are stored hash-only."
- id: sec-M-5
  requirement: MEDIUM
  severity: medium
  description: Private key PKCS8 stored as plaintext base64 in key_handle column
  module: crates/server/src/web/management.rs
  status: fixed
  fix: "AES-256-GCM envelope encryption with KEK for signing key material at rest. KEK derived from AEGAEON_KEY_ENCRYPTION_KEY env var."
- id: sec-M-6
  requirement: MEDIUM
  severity: medium
  description: In-memory session store has no max_sessions cap
  module: crates/server/src/web/management.rs
  status: fixed
  fix: "ManagementSessionStore.max_sessions (default 10,000) with LRU eviction — expired sessions evicted first, then oldest."
  tests:
  - crates/server/src/web/management.rs
- id: sec-M-7
  requirement: MEDIUM
  severity: medium
  description: Audit events tables allow UPDATE/DELETE
  module: db/schema.sql
  status: fixed
  fix: "REVOKE UPDATE, DELETE ON aegaeon.audit_events and aegaeon.audit_events_default FROM PUBLIC."
- id: sec-M-8
  requirement: MEDIUM
  severity: medium
  description: refresh_parent field missing serde skip — could leak in serialized responses
  module: crates/server/src/authcode/types.rs
  status: fixed
  fix: "#[serde(skip_serializing)] on refresh_parent field (unconditional skip, not skip_serializing_if)."
- id: sec-L-1
  requirement: LOW
  severity: low
  description: CSRF cookie not HttpOnly
  module: crates/server/src/web/management.rs
  status: not_applicable
  notes:
  - "By design — double-submit CSRF pattern requires JavaScript access to cookie value."
- id: sec-L-2
  requirement: LOW
  severity: low
  description: Origin header comparison uses string equality
  module: crates/server/src/web/management.rs
  status: not_applicable
  notes:
  - "Low priority — origin comparison is not a secret comparison. Timing oracle reveals nothing exploitable."
