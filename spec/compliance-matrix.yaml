  - client

- id: 8693-108
  section: '2.2.1'
  requirement: MUST
  description: scope is OPTIONAL if identical to the requested scope; otherwise it is REQUIRED in the token exchange response.
  module: crates/server/src/web/mod.rs
  proof:
