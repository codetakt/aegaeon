  description: When configured, the OP accepts encrypted Request Objects (compact JWE RSA-OAEP/A256GCM) that decrypt to a nested signed JWT before applying RFC 9101 validation
  module: docs/program-management/historical/roadmaps/oidc-execution-plan.md
  proof:
  - type: plan
    document: docs/program-management/historical/roadmaps/oidc-execution-plan.md
  - type: fstar
    file: fstar/par/RequestObject.fst
    invariant: lemma_merge_request_object_wins
  tests:
  - crates/server/src/web/token_exchange_tests/request_object_retention.rs
  ci_check: cargo test -p aegaeon-server --lib web::token_exchange_tests::request_object_retention
  status: verified
  runtime_link: crates/server/src/web/token_exchange_tests/request_object_retention.rs
  notes:
  - Verified by `crates/server/src/web/token_exchange_tests/request_object_retention.rs::jar_par_binding_encrypted_request_object_valid_flow`.
- id: OIDC-5-002
  section: Request Object (JAR) RS256 interoperability
  requirement: SHOULD
  description: When signed Request Objects are supported, the RS256 verification path for Request Objects and request_uri consumption SHOULD be brought inside the verification boundary as the RS256 Interop Slice
  module: docs/verification/oidc/rs256-interop-slice.md
  proof:
  - type: fstar
    file: fstar/par/RequestObject.fst
    invariant: lemma_merge_request_object_wins
  - type: tamarin
    file: proofs/tamarin/par/jar_par_fixation.spthy
    lemma: jar_parameter_fixation
  tests:
  - crates/server/src/web/token_exchange_tests/request_object_retention.rs
  - crates/server/src/par/tests/request_lifecycle.rs
  - crates/jose/src/jws.rs
  - crates/jose/tests/wycheproof_rsa_pkcs1_test.rs
  - crates/crypto/src/signature.rs
  - tests/vectors/wycheproof/rsa_signature_2048_sha256_test.json
  status: verified
  runtime_link: crates/jose/src/request_object.rs
  notes:
  - "Runtime routes direct `request=` and `request_uri`/PAR Request Objects using `RS256` through the interoperability boundary-exception verifier and `PS256` through verified `Hacl_RSAPSS` routing."
  - "The shared RS256 verifier encodes RSA JWK components as SPKI and delegates PKCS#1 v1.5 SHA-256 verification to `aegaeon_crypto::signature::verify_rsa_pkcs1_sha256` / `aws-lc-rs`; Wycheproof RSA signature vectors are regression-tested by `crates/jose/tests/wycheproof_rsa_pkcs1_test.rs::wycheproof_rsa_pkcs1_sha256_vectors_follow_expected_results`."
  - "Discovery now advertises `request_parameter_supported=true` to match the direct `request=` runtime support."
  - "This row retains the narrow `RS256` interoperability boundary exception and adds verified-backend `PS256` routing; broader RSA / JOSE interoperability remains compat or rejected."
