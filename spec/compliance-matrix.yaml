  applies_to:
  - as

- id: 8693-106
  section: '2.2.2'
  requirement: SHOULD
  description: If unwilling/unable to issue a token for any target service indicated by resource/audience, error=invalid_target SHOULD be used.
  module: crates/server/src/web/mod.rs
  proof:
  - type: fstar
