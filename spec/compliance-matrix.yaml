  - type: kani
    file: crates/kani-harness/src/bounded_subordinate_stmt.rs
    harness: proof_ss1_iss_is_op
  - type: tamarin
    file: proofs/tamarin/federation/op_entity_configuration.spthy
    lemma: subordinate_only_for_registered
  tests:
  - crates/server/src/web/upstream_tests/federation_signing.rs
  ci_check: federation-op-fetch-ss1
  status: planned
  runtime_link: crates/server/src/web/mod.rs
  notes:
  - Public OpenID Federation fetch is not active in the verified server claim; current endpoint returns 404.
  - SS-1 security property. Structurally enforced by build_subordinate_statement, which projects openid_relying_party metadata from the registered client whose client_id equals sub.
- id: fed-op-007
  section: '7.1'
  requirement: MUST
  description: Future active Federation fetch endpoint MUST return subordinate statements with sub = RP entity_id (SS-2)
  module: crates/server/src/web/mod.rs
  proof:
  - type: fstar
    file: fstar/federation/OpSubordinateStatement.fst
    invariant: has_subject
  - type: kani
    file: crates/kani-harness/src/bounded_subordinate_stmt.rs
    harness: proof_ss2_sub_is_rp
  tests:
  - crates/server/src/web/upstream_tests/federation_signing.rs
  ci_check: federation-op-fetch-ss2
  status: planned
  runtime_link: crates/server/src/web/mod.rs
  notes:
  - Public OpenID Federation fetch is not active in the verified server claim; current endpoint returns 404.
  - SS-2 security property. sub set to the requested entity_id (client_id).
- id: fed-op-008
  section: '7.1'
  requirement: MUST
  description: Future active Federation fetch endpoint MUST NOT return self-signed subordinate statements (iss != sub) (SS-3)
  module: crates/server/src/web/mod.rs
  proof:
  - type: fstar
    file: fstar/federation/OpSubordinateStatement.fst
    invariant: not_self_signed
  - type: kani
    file: crates/kani-harness/src/bounded_subordinate_stmt.rs
    harness: proof_ss3_not_self_signed
  tests:
  - crates/server/src/web/upstream_tests/federation_signing.rs
  ci_check: federation-op-fetch-ss3
  status: planned
  runtime_link: crates/server/src/web/mod.rs
  notes:
  - Public OpenID Federation fetch is not active in the verified server claim; current endpoint returns 404.
  - SS-3 security property. F* precondition op_entity_id <> rp_entity_id.
- id: fed-op-009
  section: '7.1'
  requirement: MUST
  description: Future active Federation fetch endpoint MUST bound subordinate statement exp (SS-4)
  module: crates/server/src/web/mod.rs
  proof:
  - type: fstar
    file: fstar/federation/OpSubordinateStatement.fst
    invariant: exp_within_bound
  - type: kani
    file: crates/kani-harness/src/bounded_subordinate_stmt.rs
    harness: proof_ss4_exp_bounded
  tests:
  - crates/server/src/web/upstream_tests/federation_signing.rs
  ci_check: federation-op-fetch-ss4
  status: planned
  runtime_link: crates/server/src/web/mod.rs
  notes:
  - Public OpenID Federation fetch is not active in the verified server claim; current endpoint returns 404.
  - Clamped to max 86400 seconds (24h). Matches entity configuration bound.
- id: fed-op-010
  section: '8.2'
  requirement: MUST
  description: Future active Federation list endpoint MUST return a JSON array of subordinate entity_ids
  module: crates/server/src/web/mod.rs
  proof:
  - type: fstar
    file: fstar/federation/OpSubordinateStatement.fst
    invariant: lemma_well_formed
  - type: tamarin
    file: proofs/tamarin/federation/op_entity_configuration.spthy
    lemma: subordinate_only_for_registered
  tests:
  - crates/server/src/web/upstream_tests/federation_list.rs
  ci_check: federation-op-list
  status: planned
  runtime_link: crates/server/src/web/mod.rs
  notes:
  - Public OpenID Federation list is not active in the verified server claim; current endpoint returns 404.
  - The bounded pagination parser remains tested as a future/internal admission component.
- id: fed-op-011
  section: '8.3'
  requirement: MUST
  description: Future active advertised federation resolve endpoint MUST return a signed resolve-response JWT with resolved metadata and trust_chain
  module: crates/server/src/web/mod.rs
  proof:
  - type: fstar
    file: fstar/federation/OpSubordinateStatement.fst
    invariant: lemma_well_formed
  - type: tamarin
    file: proofs/tamarin/federation/trust_chain.spthy
    lemma: chain_to_trust_anchor
  tests:
  - crates/server/src/web/upstream_tests/federation_signing.rs
  - crates/server/src/web/upstream_tests/federation_list.rs
  ci_check: federation-op-resolve
  status: planned
  runtime_link: crates/server/src/web/mod.rs
  notes:
  - Public OpenID Federation resolve is not active in the verified server claim; current endpoint returns 404.
  - The formal evidence covers trust-chain integrity and OP subordinate-statement shape; the signed
    resolve-response JWT envelope is not part of the active server runtime claim.
  - Requires exactly one sub and at least one configured trust_anchor query parameter; repeated
    trust_anchor and entity_type parameters are parsed and preserved in query order.
  - Future active resolve support must return application/resolve-response+jwt with
    typ=resolve-response+jwt, resolved metadata, and compact Entity Statement JWTs in verified
    leaf-to-anchor order.
  - Trust mark inclusion remains outside the current server claim.

global:
- id: global-001
  requirement: MUST
  description: All endpoints MUST validate Content-Type headers
  module: crates/server/src/web/mod.rs
  proof:
  - type: policy
    rule: content_type_validation
  tests:
  - crates/server/src/web/request_admission.rs
  ci_check: global-content-type
  status: implemented
  notes:
  - Non-matching Content-Type is rejected consistently with invalid_request.
- id: global-002
  requirement: MUST
  description: All cryptographic operations MUST use verified implementations
  module: docs/policies/verified-crypto-policy.md
  proof:
  - type: fstar
    invariant: only_verified_crypto
  - type: hacl
    coverage: hmac_sha256, chacha20poly1305
  tests: []
  ci_check: global-verified-crypto
  status: partial
  notes:
  - "Verified (production default): HMAC-SHA256 via EverCrypt (jose::jws → ffi::verify_hmac → EverCrypt_HMAC_compute). Also used for management CSRF and session token HMAC."
  - "Verified (production default): Ed25519 verification via the JOSE/DPoP FFI path. Server-issued EdDSA signing is a runtime crypto provider boundary, not a verified signing implementation claim."
  - "Verified (production default): ChaCha20-Poly1305 via EverCrypt (ffi::encrypt/decrypt → Jose_Jwe_chacha20poly1305)."
  - "Verified (parsing): JOSE header/DCR/DPoP schemas via EverParse-generated C."
  - "Verified (JOSE verified dispatch): PS256 verification via Hacl_RSAPSS (jose::jws → ffi::verify_rsa → Hacl_RSAPSS_rsapss_pkey_verify), including promoted JAR and client-assertion routing. PS256 signing remains compat."
  - "Not verified or outside the strong runtime crypto implementation claim: broad RS256 outside promoted slices, PS256 signing (aws-lc-rs/KMS), ES256 (p256), server-issued JWT signing backends, AES-256-GCM (aws-lc-rs), RSA-OAEP (aws-lc-rs/mbedtls), TLS (rustls), RNG (getrandom)."
  - "Inventory and exceptions tracked in docs/policies/verified-crypto-policy.md."
  - "Status remains partial until all crypto operations either route through verified implementations or are explicitly documented as promoted/TCB boundaries."
- id: global-003
  requirement: MUST
  description: All time comparisons MUST account for clock skew
  module: crates/jose/src/jwt.rs
  proof:
  - type: fstar
    file: fstar/token/Bearer.fst
    invariant: is_token_valid_time
  tests:
  - crates/jose/tests/jwt_validate.rs
  ci_check: global-clock-skew
  status: partial
  runtime_link: crates/jose/src/jwt.rs
  notes:
  - JWT exp/nbf/iat checks apply configurable leeway to tolerate clock skew.
- id: global-004-everparse
  requirement: MUST
  description: EverParse schemas MUST have checked-in generated artefacts and fail closed when missing (defense-in-depth framing for FFI boundaries)
  module: crates/ffi/build.rs
  proof:
  - type: everparse
    spec: fstar/lowparse/JoseHeader.3d
    artefact: generated/everparse/JoseHeader.c
    file: crates/ffi/src/jose_header.rs
    coverage: jose_header_entry_framing
  - type: everparse
    spec: fstar/lowparse/DCR.3d
    artefact: generated/everparse/DCR.c
    file: crates/ffi/src/dcr_parser.rs
    coverage: dcr_message_framing
  - type: everparse
    spec: fstar/lowparse/DcrRegistration.3d
    artefact: generated/everparse/DcrRegistration.c
    file: crates/ffi/build.rs
    coverage: dcr_policy_payload_framing
  - type: everparse
    spec: fstar/lowparse/Dpop.3d
    artefact: generated/everparse/Dpop.c
    file: crates/ffi/src/lib.rs
    coverage: dpop_claims_framing
  - type: everparse
    spec: fstar/lowparse/IdTokenSchema.3d
    artefact: generated/everparse/IdTokenSchema.c
    file: crates/ffi/src/id_token.rs
    coverage: oidc_id_token_userinfo_framing
  - type: everparse
    spec: fstar/lowparse/LogoutTokenSchema.3d
    artefact: generated/everparse/LogoutTokenSchema.c
    file: crates/ffi/build.rs
    coverage: oidc_logout_token_framing
  tests: []
  ci_check: scripts/extraction/run_everparse_batch.sh + verification.yml:everparse-dcr
  status: verified
  runtime_link: crates/ffi/build.rs
  trace:
    kind: exempt
    note: "EverParse artefact grounding (generated/everparse, fail-closed via crates/ffi/build.rs); no F* function-level counterpart in the trace schema."
  notes:
  - generated/everparse is source-managed; CI regenerates via scripts/extraction/run_everparse_batch.sh and fails if diffs are present.
  - crates/ffi/build.rs fails closed in non-test builds if required EverParse artefacts are missing.
