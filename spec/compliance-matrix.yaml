rfc_8705:
- id: 8705-001
  requirement: TRACKING
  description: Track RFC 8705 (OAuth 2.0 Mutual-TLS Client Authentication and Certificate-Bound Access Tokens) end-to-end enforcement.
  module: docs/program-management/roadmaps/active/oauth-rfc-coverage-roadmap.md
  status: implemented
  applies_to:
  - as
  - client
  - rs
  notes:
  - "mTLS certificate-bound access tokens are enforced via SenderConstraint=mtls (x-forwarded-client-cert fingerprint binding) and validated by TokenValidator."
  - "Metadata exposure is gated by the active database-backed mTLS policy and advertises tls_client_certificate_bound_access_tokens + mtls_endpoint_aliases when enabled."
  - "TLS client authentication methods (tls_client_auth/self_signed_tls_client_auth) are not implemented or advertised; client auth remains via existing methods."

- id: 8705-101
  section: '3'
  requirement: MUST
  description: Protected resources MUST verify the mTLS client certificate matches the certificate bound to the access token; mismatches MUST be rejected with HTTP 401 and invalid_token.
  module: crates/server/src/authcode/token.rs
  proof:
  - type: fstar
    file: fstar/token/Bearer.Policy.fst
    invariant: lemma_sender_binding_unique
  - type: fstar
    file: fstar/token/JwtAccessToken.fst
    invariant: lemma_cnf_binding_present
  tests:
  - crates/server/src/web/token_sender_binding.rs
  - crates/server/src/web/resource_endpoint/policy.rs
  status: verified
  runtime_link: crates/server/src/authcode/token.rs
  trace:
    kind: guard
    fstar: fstar/token/Bearer.Policy.fst#lemma_sender_binding_unique
    rust: crates/server/src/authcode/token/validator/policy.rs#enforce_policies
    test: crates/server/src/authcode/store/tests/sender_binding.rs
  applies_to:
  - rs

- id: 8705-102
  section: '3.3'
  requirement: MAY
  description: Authorization server metadata MAY include tls_client_certificate_bound_access_tokens to signal support for certificate-bound access tokens; Aegaeon publishes an explicit boolean (default false) and flips it from the active database-backed mTLS policy.
  module: crates/server/src/metadata.rs
  proof:
  - type: fstar
    file: fstar/token/JwtAccessToken.fst
    invariant: is_sender_constrained
  tests:
  - crates/server/src/metadata.rs
  status: verified
  runtime_link: crates/server/src/metadata.rs
  applies_to:
  - as
  - client

- id: 8705-103
  section: '5'
  requirement: MAY
  description: Authorization server metadata MAY include mtls_endpoint_aliases; when the active database-backed mTLS policy is enabled, Aegaeon advertises mTLS aliases for token/revocation/introspection endpoints (and optional PAR alias).
  module: crates/server/src/metadata.rs
  tests:
  - crates/server/src/metadata.rs
  status: implemented
  applies_to:
  - as
  - client

- id: 8705-104
  section: '3.2'
  requirement: SHOULD
  description: For certificate-bound access tokens, the authorization server should convey the certificate thumbprint confirmation via cnf with x5t#S256 as a top-level member of the token introspection response.
  module: crates/server/src/web/mod.rs
  proof:
  - type: fstar
    file: fstar/token/JwtAccessToken.fst
    invariant: lemma_cnf_binding_present
  - type: fstar
    file: fstar/token/JwtAccessToken.fst
    invariant: lemma_sender_constrained_well_formed
  tests:
  - crates/server/src/web/token_sender_binding.rs
  status: verified
  runtime_link: crates/server/src/web/mod.rs
  applies_to:
  - as
  - rs
  notes:
  - "Aegaeon stores mTLS sender binding as a normalized SHA256 hex fingerprint and converts it to x5t#S256 base64url in /introspect responses."

rfc_8707:
- id: 8707-001
  requirement: TRACKING
  description: Track RFC 8707 (Resource Indicators) requirements for audience/resource-bound token issuance and validation.
  module: docs/program-management/roadmaps/active/oauth-rfc-coverage-roadmap.md
  status: implemented
  applies_to:
  - as
  - client
  - rs
  notes:
  - "Aegaeon currently supports a single resource indicator; multiple values are rejected with invalid_target."
  - "Client-side resource indicator usage is tracked in the OAuth client/RP roadmap (outside this repo)."

- id: 8707-101
  requirement: MUST
  description: Authorization server MUST validate resource indicator values as absolute URIs without fragments and fail closed with invalid_target on invalid input.
  module: crates/server/src/util.rs
  proof:
  - type: plan
    document: docs/program-management/initiatives/oauth/oauth-formal-verification-plan.md
  - type: fstar
    file: fstar/resource/ResourceIndicators.fst
    refinement: resource_indicator_wellformed
  tests:
  - crates/server/src/util.rs
  - crates/server/src/authcode/token.rs
  status: verified
  runtime_link: crates/server/src/util.rs
  trace:
    kind: guard
    fstar: fstar/resource/ResourceIndicators.fst#resource_indicator_wellformed
    rust: crates/server/src/util/resource.rs#validate_resource_indicator
    test: crates/server/src/util/tests.rs
  applies_to:
  - as
  notes:
  - "validate_resource_indicator enforces RFC 3986 absolute URIs and rejects fragments."

- id: 8707-102
  requirement: MUST
  description: Authorization server MUST bind issued access tokens to the selected resource (audience) when resource indicators are used.
  module: crates/server/src/authcode/token.rs
  proof:
  - type: plan
    document: docs/program-management/initiatives/oauth/oauth-formal-verification-plan.md
  - type: fstar
    file: fstar/resource/ResourceIndicators.fst
    lemma: lemma_audience_binds_to_resource
  - type: tamarin
    file: proofs/tamarin/resource/resource_indicators.spthy
    lemma: resource_audience_enforced
  tests:
  - crates/server/src/authcode/token.rs
  status: verified
  runtime_link: crates/server/src/authcode/token.rs
  trace:
    kind: guard
    fstar: fstar/resource/ResourceIndicators.fst#lemma_audience_binds_to_resource
    rust: crates/server/src/authcode/token.rs#issue_access_token_value
    test: crates/server/src/authcode/token/tests/resource_audience.rs
  applies_to:
  - as
  notes:
  - "BearerTokenMeta.audience is set to the selected resource; defaults to client_id when resource is absent."

- id: 8707-103
  requirement: MUST
  description: Authorization server MUST reject token requests that ask for a resource not permitted by the authorization grant and return invalid_target.
  module: crates/server/src/authcode/token.rs
  proof:
  - type: plan
    document: docs/program-management/initiatives/oauth/oauth-formal-verification-plan.md
  - type: fstar
    file: fstar/resource/ResourceIndicators.fst
    lemma: lemma_resource_mismatch_rejected
  tests:
  - crates/server/src/authcode/token.rs
  status: verified
  runtime_link: crates/server/src/authcode/token.rs
  trace:
    kind: guard
    fstar: fstar/resource/ResourceIndicators.fst#lemma_resource_mismatch_rejected
    rust: crates/server/src/authcode/token/authorization_code_grant/validation.rs#select_authorized_resource
    test: crates/server/src/authcode/token/tests/resource_audience.rs
  applies_to:
  - as
  notes:
  - "Mismatch between stored and requested resource returns invalid_target."

- id: 8707-104
  requirement: MUST
  description: Authorization server MUST support resource indicators for client_credentials token requests and bind the access token audience accordingly.
  module: crates/server/src/authcode/token.rs
  proof:
  - type: plan
    document: docs/program-management/initiatives/oauth/oauth-formal-verification-plan.md
  - type: fstar
    file: fstar/resource/ResourceIndicators.fst
    lemma: lemma_audience_binds_to_resource
  tests:
  - crates/server/src/authcode/token.rs
  status: verified
  runtime_link: crates/server/src/authcode/token.rs
  trace:
    kind: guard
    fstar: fstar/resource/ResourceIndicators.fst#lemma_audience_binds_to_resource
    rust: crates/server/src/web/token_client_credentials.rs#handle_token_client_credentials_grant
    test: crates/server/src/authcode/token/tests/resource_audience.rs
  applies_to:
  - as

rfc_8725:
- id: 8725-001
  requirement: TRACKING
  description: Track RFC 8725 JWT Best Current Practices posture for all JWT usage (client assertions, request objects, ID tokens).
  module: docs/program-management/roadmaps/active/oauth-rfc-coverage-roadmap.md
  status: implemented
  applies_to:
  - as
  - client
  notes:
  - "Some JWT/JWS safety requirements are already enforced via JOSE allow-lists; capture remaining BCP items explicitly."
  - "Client assertion (private_key_jwt) hardening is tracked below."
  - "JWT bearer grant assertions, Request Object validation, and ID Token signing algorithm posture are mapped explicitly below."

- id: 8725-101
  section: '3.1'
  requirement: MUST
  description: Implementations MUST enforce an application/operation-specific allow-list of JWT/JWS algorithms and reject tokens using algorithms outside that set.
  module: crates/server/src/client_registry.rs
  proof:
  - type: fstar
    file: fstar/jose/Jose.Jws_header.fst
    invariant: lemma_parse_valid
  - type: policy
    rule: pkjwt_enforces_operator_configured_alg_allowlist
  tests:
  - crates/server/src/client_registry/jwks_helpers_tests/registry_core.rs
  status: verified
  runtime_link: crates/server/src/client_registry.rs
  trace:
    kind: guard
    fstar: fstar/auth/Pkjwt.fst#pkjwt_signature_verified_and_alg_allowed
    rust: crates/server/src/client_registry/assertions/private_key_jwt.rs#admit_private_key_jwt_header
    test: crates/server/src/client_registry/jwks_helpers_tests/registry_core.rs
  applies_to:
  - as
  notes:
  - "Aegaeon enforces the promoted RSA verification allow-list for private_key_jwt via policy.clientJwtAllowedAlgs (default RS256, optional verified-backend PS256)."

- id: 8725-102
  section: '3.2'
  requirement: MUST
  description: Applications MUST only allow cryptographically current algorithms; JWTs using \"none\" MUST NOT be accepted unless explicitly requested.
  module: crates/server/src/client_registry.rs
  proof:
  - type: fstar
    file: fstar/jose/Jose.Jws_header.fst
    invariant: lemma_parse_valid
  - type: policy
    rule: pkjwt_rejects_none_algorithm
  tests:
  - crates/server/src/client_registry/jwks_helpers_tests/registry_core.rs
  status: verified
  runtime_link: crates/server/src/client_registry.rs
  trace:
    kind: guard
    fstar: fstar/jose/Jose.Alg_policy.fst#is_supported_alg
    rust: crates/jose/src/jws.rs#verify_compact_with_profile
    test: crates/jose/src/jws.rs
  applies_to:
  - as
  notes:
  - "Aegaeon rejects alg=none for client assertions."

- id: 8725-103
  section: '3.3'
  requirement: MUST
  description: Cryptographic operations used in JWT processing MUST be validated and the JWT MUST be rejected if validation fails.
  module: crates/server/src/client_registry.rs
  proof:
  - type: tamarin
    file: proofs/tamarin/client_auth/private_key_jwt.spthy
    lemma: pkjwt_unforgeability
  - type: policy
    rule: pkjwt_rejects_on_crypto_validation_failure
  tests:
  - crates/server/src/client_registry/jwks_helpers_tests/registry_core.rs
  status: verified
  runtime_link: crates/server/src/client_registry.rs
  trace:
    kind: exempt
    note: "Tamarin protocol-level property (pkjwt_unforgeability); generic cryptographic-failure rejection has no single F* function-level counterpart."
  applies_to:
  - as
  notes:
  - "Any signature/claim validation failure results in invalid_client at the token endpoint when private_key_jwt is required."

- id: 8725-104
  section: '3.8'
  requirement: MUST
  description: When a JWT contains an iss claim, the application MUST validate that the cryptographic keys used belong to the issuer; otherwise it MUST reject the JWT.
  module: crates/server/src/client_registry.rs
  proof:
  - type: fstar
    file: fstar/auth/Pkjwt.fst
    invariant: pkjwt_signature_verified_and_alg_allowed
  tests:
  - crates/server/src/client_registry/jwks_helpers_tests/registry_core.rs
  status: verified
  runtime_link: crates/server/src/client_registry.rs
  trace:
    kind: guard
    fstar: fstar/auth/Pkjwt.fst#pkjwt_signature_verified_and_alg_allowed
    rust: crates/server/src/client_registry/assertions/private_key_jwt.rs#verify_private_key_jwt_claims
    test: crates/jose/tests/jwt_validate.rs
  applies_to:
  - as
  notes:
  - "Aegaeon uses a stricter profile: iss=sub=client_id and the verification key is resolved from that client's registered JWKS/JWK material."

- id: 8725-105
  section: '3.9'
  requirement: MUST
  description: Applications MUST validate the aud claim when present and MUST reject JWTs where aud is missing or not associated with the recipient.
  module: crates/server/src/client_registry.rs
  proof:
  - type: fstar
    file: fstar/auth/Pkjwt.fst
    invariant: pkjwt_audience_matches_expected
  tests:
  - crates/server/src/client_registry/jwks_helpers_tests/registry_core.rs
  status: verified
  runtime_link: crates/server/src/client_registry.rs
  trace:
    kind: guard
    fstar: fstar/auth/Pkjwt.fst#pkjwt_audience_matches_expected
    rust: crates/server/src/client_registry/assertions/private_key_jwt.rs#verify_private_key_jwt_claims
    test: crates/jose/tests/jwt_validate.rs
  applies_to:
  - as
  notes:
  - "Aegaeon expects aud to match the token endpoint identifier and rejects mismatches."

- id: 8725-106
  section: '3.10'
  requirement: SHOULD
  description: Applications SHOULD sanitize kid values used for key lookup and MUST NOT follow untrusted jku/x5u headers without SSRF protections.
  module: docs/policies/jose-header-policy.md
  tests:
  - crates/jose/src/jws.rs
  status: implemented
  applies_to:
  - as
  - client
  notes:
  - "kid is bounded (1..=255 ASCII) before key lookup; jku/x5u are not dereferenced and are rejected by the JOSE header policy to avoid SSRF."

- id: 8725-107
  section: '3.12'
  requirement: MUST
  description: When multiple kinds of JWTs can be issued, their validation rules MUST be mutually exclusive to prevent substitution between contexts.
  module: crates/server/src/client_registry.rs
  proof:
  - type: fstar
    file: fstar/auth/Pkjwt.fst
    invariant: jwt_bearer_assertion_valid
  tests:
  - crates/server/src/authcode/token/tests/jwt_bearer.rs
  status: verified
  runtime_link: crates/server/src/client_registry.rs
  trace:
    kind: guard
    fstar: fstar/auth/Pkjwt.fst#jwt_bearer_subject_and_audience_profile
    rust: crates/server/src/client_registry/assertions/jwt_bearer.rs#verify_jwt_bearer_claims
    test: crates/server/src/authcode/token/tests/jwt_bearer.rs
  applies_to:
  - as
  notes:
  - "Default: jwt-bearer assertions with sub==client_id are rejected to prevent substitution with private_key_jwt."
  - "If policy.jwtBearerAllowClientSubject=true, sub==client_id is allowed only when aud={issuer} and MUST NOT include the token endpoint audience, preserving mutual exclusivity."
  - "Request Objects are separated via aud=/authorize and are rejected at /token."

- id: 8725-201
  section: '3.1'
  requirement: MUST
  description: (JWT bearer grant) Implementations MUST enforce an operation-specific allow-list of algorithms and reject JWT bearer assertions outside that set.
  module: crates/server/src/client_registry.rs
  proof:
  - type: fstar
    file: fstar/auth/Pkjwt.fst
    invariant: jwt_bearer_assertion_valid
  - type: tamarin
    file: proofs/tamarin/jwt_bearer/jwt_bearer_security.spthy
    lemma: jwt_bearer_unforgeability
  tests:
  - crates/server/src/authcode/token/tests/jwt_bearer.rs
  status: verified
  runtime_link: crates/server/src/client_registry.rs
  trace:
    kind: guard
    fstar: fstar/auth/Pkjwt.fst#jwt_bearer_assertion_valid
    rust: crates/server/src/client_registry/assertions/jwt_bearer.rs#try_validate_jwt_bearer_grant_assertion
    test: crates/server/src/authcode/token/tests/jwt_bearer.rs
  applies_to:
  - as
  notes:
  - "JWT bearer assertions reuse the promoted RSA verification allow-list (policy.clientJwtAllowedAlgs): default RS256 plus optional PS256 routed to `Hacl_RSAPSS`."

- id: 8725-202
  section: '3.2'
  requirement: MUST
  description: (JWT bearer grant) Assertions using alg=none MUST NOT be accepted unless explicitly requested.
  module: crates/server/src/client_registry.rs
  proof:
  - type: fstar
    file: fstar/auth/Pkjwt.fst
    invariant: jwt_bearer_assertion_valid
  tests:
  - crates/server/src/authcode/token/tests/jwt_bearer.rs
  status: verified
  runtime_link: crates/server/src/client_registry.rs
  trace:
    kind: guard
    fstar: fstar/auth/Pkjwt.fst#jwt_bearer_assertion_valid
    rust: crates/server/src/client_registry/assertions/jwt_bearer.rs#try_validate_jwt_bearer_grant_assertion
    test: crates/server/src/authcode/token/tests/jwt_bearer.rs
  applies_to:
  - as
  notes:
  - "Aegaeon rejects alg=none (and any unsupported algorithm) for JWT bearer assertions."

- id: 8725-203
  section: '3.8'
  requirement: MUST
  description: (JWT bearer grant) When a JWT contains an iss claim, the application MUST validate that the cryptographic keys used belong to the issuer; otherwise it MUST reject the JWT.
  module: crates/server/src/client_registry.rs
