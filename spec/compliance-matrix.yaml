metadata:
  description: Compliance matrix for OAuth 2.x implementation with formal verification
  standards:
  - 'RFC 6749: OAuth 2.0 Framework'
  - 'RFC 6750: Bearer Token Usage'
  - 'RFC 6755: OAuth 2.0 URN Sub-Namespace'
  - 'RFC 6819: OAuth 2.0 Threat Model (Historic)'
  - 'RFC 7009: Token Revocation'
  - 'RFC 7515-7519: JOSE/JWT'
  - 'RFC 7521: Assertion Framework for OAuth 2.0'
  - 'RFC 7522: SAML 2.0 Profile for OAuth 2.0 Client Authentication and Authorization Grants'
  - 'RFC 7523: JWT Profile for OAuth 2.0 Client Authentication and Authorization Grants'
  - 'RFC 7591: Dynamic Client Registration'
  - 'RFC 7592: Dynamic Client Registration Management'
  - 'RFC 7636: PKCE'
  - 'RFC 7662: Token Introspection'
  - 'RFC 7800: Proof-of-Possession Key Semantics for JWTs'
  - 'RFC 8176: Ambiguity of Uppercase vs Lowercase in RFCs'
  - 'RFC 8252: OAuth 2.0 for Native Apps'
  - 'RFC 8414: Authorization Server Metadata'
  - 'RFC 8628: Device Authorization Grant'
  - 'RFC 8693: OAuth 2.0 Token Exchange'
  - 'RFC 8705: Mutual-TLS Client Authentication and Certificate-Bound Access Tokens'
  - 'RFC 8707: Resource Indicators for OAuth 2.0'
  - 'RFC 8725: JWT Best Current Practices'
  - 'RFC 9068: JWT Profile for Access Tokens'
  - 'RFC 9101: JWT-Secured Authorization Request (JAR)'
  - 'RFC 9123: OAuth 2.0 for Browser-Based Apps'
  - 'RFC 9126: Pushed Authorization Requests (PAR)'
  - 'RFC 9207: Authorization Server Issuer Identifier in Authorization Response'
  - 'RFC 9278: JWK Thumbprint URI'
  - 'RFC 9396: Rich Authorization Requests (RAR)'
  - 'RFC 9449: Demonstrating Proof-of-Possession (DPoP)'
  - 'RFC 9470: Step-Up Authentication Challenge Protocol'
  - 'RFC 9700: OAuth 2.0 Security BCP'
  - 'RFC 9701: Introspection Response in JWT format'
  - 'RFC 9728: OAuth 2.0 Protected Resource Metadata'
  - 'RFC 9901: SD-JWT'
  - 'draft-ietf-oauth-v2-1: OAuth 2.1'
  - OpenID Connect Core 1.0
  - OpenID Connect Discovery 1.0
  - OpenID Connect Dynamic Client Registration 1.0
rfc_6749:
- id: 6749-001
  section: 1.3.1
  requirement: MUST
  description: Authorization server MUST authenticate the client when issuing an access
    token
  module: crates/server/src/client_registry.rs
  proof:
  - type: tamarin
    file: proofs/tamarin/client_auth/client_authentication.spthy
    lemma: client_authentication
  tests:
  - crates/server/src/client_registry.rs
  ci_check: client-auth-verification
  status: verified
  runtime_link: crates/server/src/client_registry.rs
  trace:
    kind: exempt
    note: "Tamarin protocol-level property (client_authentication); no F* function-level counterpart."
- id: 6749-002
  section: '3.1'
  requirement: MUST
  description: Authorization endpoint MUST support TLS
  module: crates/server/src/web/authorize_endpoint.rs
  proof:
  - type: policy
    rule: tls_required_authorization_endpoint
  tests:
  - crates/server/src/main.rs
  ci_check: tls-enforcement
  status: implemented
- id: 6749-003
  section: 3.1.2.2
  requirement: MUST
  description: Redirection endpoint MUST be an absolute URI
  module: crates/server/src/web/dcr_registration.rs
  tests:
  - crates/server/src/web/dcr_registration.rs
  ci_check: redirect-uri-validation
  status: implemented
  runtime_link: crates/server/src/web/dcr_registration.rs
- id: 6749-004
  section: 3.1.2.3
  requirement: MUST
  description: Authorization server MUST NOT automatically redirect on invalid request
  module: crates/server/src/main.rs
  tests:
  - crates/server/src/web/token_exchange_tests/authorize_query.rs
  ci_check: redirect-security
  status: implemented
  runtime_link: crates/server/src/main.rs
  notes:
  - Invalid redirect_uri requests fail with HTTP 400 and no redirect.
- id: 6749-005
  section: '4.1.2'
  requirement: MUST
  description: Authorization code MUST expire shortly after issuance (max 10 minutes)
  module: fstar/authcode/AuthCode.Store.fst
  proof:
  - type: fstar
    file: fstar/authcode/AuthCode.Flow.fst
    invariant: authorize
  tests:
  - crates/server/src/authcode/token/tests/token_exchange.rs
  - crates/server/tests/spec_oracle_test.rs
  ci_check: code-expiry
  status: verified
  runtime_link: crates/server/src/authcode/store.rs
  trace:
    kind: oracle
    fstar: fstar/authcode/AuthCode.Store.fst#code_not_expired
    rust: crates/server/src/authcode/store.rs#authorization_code_not_expired_for_spec_oracle
    test: crates/server/tests/spec_oracle_test.rs
  notes:
  - Runtime enforces bounded authorization-code lifetime and rejects expired codes.
- id: 6749-006
  section: '4.1.2'
  requirement: MUST
  description: Authorization code MUST be single-use
  module: fstar/authcode/AuthCode.Store.fst
  proof:
  - type: tamarin
    file: proofs/tamarin/authcode/code_replay.spthy
    lemma: code_single_use
  tests:
  - crates/server/src/authcode/token/tests/token_exchange.rs
  ci_check: code-single-use
  status: verified
  runtime_link: crates/server/src/authcode/store.rs
  trace:
    kind: guard
    fstar: fstar/authcode/AuthCode.Store.fst#use_auth_code
    rust: crates/server/src/authcode/code_store.rs#use_code
    test: crates/server/src/authcode/token/tests/token_exchange.rs
  notes:
  - Authorization code reuse is rejected (invalid_grant).
- id: 6749-007
  section: '4.1.3'
  requirement: MUST
  description: Authorization server MUST ensure authorization code was issued to authenticated
    client
  module: fstar/authcode/AuthCode.Flow.fst
  proof:
  - type: tamarin
    file: proofs/tamarin/authcode/code_injection.spthy
    lemma: no_code_injection
  tests:
  - crates/server/src/authcode/token/tests/token_exchange.rs
  ci_check: code-binding
  status: verified
  runtime_link: crates/server/src/authcode/mod.rs
  trace:
    kind: exempt
    note: "Protocol-level property proven in Tamarin (no_code_injection); the F* flow model does not bind codes to client identity at function level."
  notes:
  - Token exchange validates that the authorization code belongs to the requesting client.
- id: 6749-008
  section: '5.1'
  requirement: MUST
  description: Authorization server MUST include token_type in successful response
  module: fstar/token/Token.fst
  proof:
  - type: fstar
    file: fstar/authcode/AuthCode.Flow.fst
    invariant: issue_tokens_helper
  tests:
  - crates/server/src/authcode/token/tests/token_exchange.rs
  - crates/server/src/web/token_lifecycle/introspection.rs
  ci_check: token-response-format
  status: verified
  runtime_link: crates/server/src/authcode/token.rs
  trace:
    kind: guard
    fstar: fstar/authcode/AuthCode.Flow.fst#issue_tokens_helper
    rust: crates/server/src/authcode/token/authorization_code_grant/finalization.rs#finish_validated_authorization_code_issue
    test: crates/server/src/authcode/token/tests/token_exchange.rs
  notes:
  - Token endpoint responses include token_type (Bearer/DPoP).
- id: 6749-009
  section: '5.2'
  requirement: MUST
  description: Authorization server MUST return specific error codes for token errors
  module: fstar/token/Token.fst
  proof:
  - type: fstar
    file: fstar/authcode/AuthCode.Flow.fst
    invariant: token_exchange
  tests:
  - crates/server/src/authcode/token/tests/token_exchange.rs
  ci_check: token-error-codes
  status: partial
  runtime_link: crates/server/src/authcode/token.rs
  notes:
  - Token exchange surfaces RFC 6749 token error codes (invalid_request/invalid_client/invalid_grant).
- id: 6749-010
  section: '10.3'
  requirement: MUST
  description: Client credentials MUST NOT be included in request URI
  module: crates/server/src/web/mod.rs
  tests:
  - crates/server/src/web/request_admission.rs
  ci_check: credential-protection
  status: implemented
  runtime_link: crates/server/src/web/mod.rs
  notes:
  - Requests with client credentials in the query string are rejected (invalid_request).
- id: 6749-011
  section: '10.6'
  requirement: MUST
  description: Authorization codes MUST be bound to client_id and redirect_uri
  module: fstar/authcode/AuthCode.Store.fst
  proof:
  - type: fstar
    file: fstar/authcode/AuthCode.Types.fst
    invariant: authorization_code
  tests:
  - crates/server/src/authcode/token/tests/token_exchange.rs
  ci_check: code-binding-complete
  status: partial
  runtime_link: crates/server/src/authcode/store.rs
  notes:
  - Token exchange rejects redirect_uri mismatches and client_id mismatches.
- id: 6749-012
  section: '10.10'
  requirement: SHOULD
  description: CSRF protection using state parameter
  module: fstar/authcode/AuthCode.Store.fst
  proof:
  - type: tamarin
    file: proofs/tamarin/authcode/csrf_protection.spthy
    lemma: csrf_protection
  tests:
  - crates/server/src/web/token_exchange_tests/authorize_query.rs
  - crates/server/src/web/token_exchange_tests/authorize_query.rs
  ci_check: csrf-protection
  status: verified
  runtime_link: crates/server/src/authcode/store.rs
  notes:
  - State is echoed when provided; operators require it through the management policy field `requireStateParameter`.
- id: 6749-013
  section: '10.12'
  requirement: MUST
  description: Clients using implicit grant MUST validate state parameter
  module: crates/server/src/bcp_policy.rs
  applicability: client_only
  proof:
  - type: policy
    file: crates/server/src/bcp_policy.rs
    rule: forbid_implicit_flow
  tests:
  - crates/server/src/web/token_exchange_tests/authorize_query.rs
  ci_check: oauth2-implicit-not-supported
  status: implemented
  notes:
  - "Client-side requirement: applies only if the implicit grant is used."
  - Aegaeon does not support the implicit grant (response_type=token) in its RFC 9700 / OAuth 2.1 posture, so implicit flows are rejected by policy.
  - "Evidence: implicit-style authorization requests are rejected (crates/server/src/web/token_exchange_tests/authorize_query.rs)."

- id: 6749-014
  section: '4.4'
  requirement: MUST
  description: If the client_credentials grant is supported, the client MUST authenticate and the token endpoint MUST issue an access token; openid scope is rejected for this grant.
  module: crates/server/src/web/mod.rs
  proof:
  - type: tamarin
    file: proofs/tamarin/client_auth/client_authentication.spthy
    lemma: client_authentication
  - type: policy
    rule: client_credentials_grant_authenticated_and_scoped
  tests:
  - crates/server/src/web/token_client_credentials.rs
  ci_check: token-client-credentials
  status: verified
  runtime_link: crates/server/src/web/mod.rs
  trace:
    kind: exempt
    note: "Tamarin protocol-level property (client_authentication); no F* function-level counterpart."
  notes:
  - "Aegaeon supports client_credentials for configured clients (e.g., cc-only-client) and enforces client authentication."
  - "Scope requests are validated against the client's allowed scopes; openid is rejected for this grant."
rfc_6750:
- id: 6750-001
  section: '2.1'
  requirement: MUST
  description: Authorization header MUST use Bearer authentication scheme
  module: fstar/token/Bearer_validation.fst
  tests:
  - crates/server/src/web/resource_endpoint/policy.rs
  ci_check: bearer-header-format
  status: implemented
  runtime_link: crates/server/src/middleware/mod.rs
  notes:
  - TokenValidator rejects non-Bearer schemes (cargo test -p aegaeon-server bearer_policy).
- id: 6750-002
  section: '2.1'
  requirement: MUST
  description: Bearer token MUST be b64token format (1*( ALPHA / DIGIT / '-' / '.'
    / '_' / '~' / '+' / '/' ) *'=')
  module: crates/server/src/authcode/types.rs
  proof:
  - type: rust_test
    rule: access_token_uses_urlsafe_charset
  tests:
  - crates/server/src/web/resource_endpoint/policy.rs
  ci_check: bearer-token-format
  status: implemented
  notes:
  - Access tokens generated by AccessToken::new use URL-safe Base64 (cargo test -p
    aegaeon-server bearer_policy).
- id: 6750-003
  section: '2.3'
  requirement: MUST NOT
  description: Clients MUST NOT use more than one method to transmit bearer token
  module: fstar/token/Bearer_validation.fst
  tests:
  - crates/server/src/web/resource_endpoint/policy.rs
  ci_check: bearer-single-method
  status: implemented
  runtime_link: crates/server/src/middleware/mod.rs
  notes:
  - extract_bearer_token rejects simultaneous header/query transport (cargo test
    -p aegaeon-server bearer_policy).
- id: 6750-004
  section: '3.1'
  requirement: MUST
  description: Invalid token error response MUST include WWW-Authenticate header
  module: fstar/token/Token.fst
  tests:
  - crates/server/src/web/resource_endpoint/policy.rs
  ci_check: bearer-error-response
  status: implemented
  runtime_link: crates/server/src/authcode/token.rs
  notes:
  - 'bearer_invalid_token_response sets the required WWW-Authenticate challenge.'
- id: 6750-005
  section: '5.1'
  requirement: MUST
  description: Bearer tokens MUST be transmitted over TLS
  module: crates/server/src/middleware/tls.rs
  proof:
  - type: policy
    rule: bearer_requires_tls
  tests:
  - crates/server/src/main.rs
  - crates/server/tests/tls_enforcement_test.rs
  ci_check: bearer-tls-required
  status: implemented
  notes:
  - TransportSecurity middleware rejects non-HTTPS forwarded traffic (cargo test
    -p aegaeon-server transport).
- id: 6750-006
  section: '5.2'
  requirement: SHOULD
  description: Clients SHOULD validate TLS certificate chain
  module: crates/client/src/tls_validation.rs
  proof:
  - type: policy
    rule: tls_validation_enabled
  tests:
  - crates/client/src/tls_validation.rs
  ci_check: tls-validation
  status: implemented
  notes:
  - 'TlsValidator enforces root store/hostname checks (cargo test -p aegaeon-client).'
- id: 6750-007
  section: '5.3'
  requirement: SHOULD
  description: Bearer tokens SHOULD have limited scope and lifetime
  module: fstar/token/Token.fst
  proof:
  - type: fstar
    file: fstar/token/Bearer.fst
    invariant: is_token_fresh
  tests:
  - crates/server/src/web/resource_endpoint/policy.rs
  ci_check: token-lifetime-policy
  status: partial
  runtime_link: crates/server/src/authcode/token.rs
  notes:
  - AccessToken::is_expired enforces TTL; covered by crates/server/src/web/resource_endpoint/policy.rs.
rfc_7636:
- id: 7636-001
  section: '4.1'
  requirement: MUST
  description: code_verifier MUST be 43-128 characters from unreserved characters
  module: fstar/pkce/Pkce.Verifier.fst
  proof:
  - type: fstar
    file: fstar/pkce/Pkce.Verifier.fst
    invariant: validate_code_verifier
  tests:
  - tests/fstar/unit/TestPkceVerifier.fst
  - crates/server/tests/spec_oracle_test.rs
  ci_check: pkce-verifier-format
  status: verified
  runtime_link: crates/server/src/authcode/mod.rs
  trace:
    kind: oracle
    fstar: fstar/pkce/Pkce.Verifier.fst#validate_code_verifier
    rust: crates/server/src/authcode/token.rs#verify_pkce
    test: crates/server/tests/spec_oracle_test.rs
- id: 7636-002
  section: '4.2'
  requirement: MUST
  description: code_challenge MUST be base64url(SHA256(code_verifier)) when using
    S256
  module: fstar/pkce/Pkce.Challenge.fst
  proof:
  - type: fstar
    file: fstar/pkce/Pkce.fst
    lemma: lemma_pkce_s256_binding
  - type: hacl
    file: fstar/crypto/Verified.Crypto.Bridge.fst
    primitive: sha256_hash
  tests:
  - crates/ffi/tests/pkce_verifier_test.rs
  - crates/server/src/web/token_exchange_tests/authorize_query.rs
  - crates/server/tests/spec_oracle_test.rs
  ci_check: pkce-challenge-derivation
  status: verified
  runtime_link: crates/server/src/authcode/mod.rs
  trace:
    kind: oracle
    fstar: fstar/pkce/Pkce.fst#verify_pkce_s256
    rust: crates/server/src/authcode/token.rs#verify_pkce
    test: crates/server/tests/spec_oracle_test.rs
- id: 7636-003
  section: '4.3'
  requirement: MUST
  description: Clients MUST use S256 unless server does not support it
  module: fstar/pkce/Pkce.Method_selection.fst
  proof:
  - type: fstar
    file: fstar/pkce/Pkce.Method_selection.fst
    invariant: code_challenge_method
  tests:
  - crates/server/src/authcode/token/tests/token_exchange.rs
  - crates/server/src/par/tests/request_lifecycle.rs
  - crates/server/src/metadata.rs
  ci_check: pkce-method-selection
  status: partial
  runtime_link: crates/server/src/authcode/mod.rs
- id: 7636-004
  section: '4.4'
  requirement: MUST
  description: Authorization request MUST include code_challenge and code_challenge_method
  module: fstar/authcode/AuthCode.Flow.fst
  proof:
  - type: fstar
    file: fstar/authcode/AuthCode.Flow.fst
    invariant: authorize
  tests:
  - crates/server/src/authcode/token/tests/token_exchange.rs
  - crates/server/src/authcode/token/tests/basic_flow.rs
  - crates/server/src/par/tests/request_lifecycle.rs
  ci_check: pkce-request-params
  status: verified
  runtime_link: crates/server/src/authcode/mod.rs
  trace:
    kind: guard
    fstar: fstar/authcode/AuthCode.Flow.fst#authorize
    rust: crates/server/src/authcode/token/authorization_code.rs#prepare_authorization_code_issue
    test: crates/server/src/authcode/token/tests/basic_flow.rs
- id: 7636-005
  section: '4.5'
  requirement: MUST
  description: Server MUST associate code_challenge and method with authorization
    code
  module: fstar/authcode/AuthCode.Flow.fst
  proof:
  - type: fstar
    file: fstar/authcode/AuthCode.Flow.fst
    invariant: authorize
  tests:
  - crates/server/src/authcode/token/tests/token_exchange.rs
  ci_check: pkce-code-binding
  status: partial
  runtime_link: crates/server/src/authcode/mod.rs
- id: 7636-006
  section: '4.6'
  requirement: MUST
  description: Token request MUST include code_verifier
  module: fstar/token/Token.fst
  proof:
  - type: fstar
    file: fstar/authcode/AuthCode.Flow.fst
    lemma: lemma_verifier_required_when_challenge_present
  tests:
  - crates/server/src/authcode/token/tests/token_exchange.rs
  - crates/server/tests/spec_oracle_test.rs
  ci_check: pkce-token-request
  status: verified
  runtime_link: crates/server/src/authcode/token.rs#verify_pkce
  trace:
    kind: oracle
    fstar: fstar/pkce/Pkce.Verifier.fst#validate_code_verifier
    rust: crates/server/src/authcode/token.rs#verify_pkce
    test: crates/server/tests/spec_oracle_test.rs
- id: 7636-007
  section: '4.6'
  requirement: MUST
  description: Server MUST verify code_verifier matches stored code_challenge
  module: fstar/pkce/Pkce.fst
  proof:
  - type: fstar
    file: fstar/pkce/Pkce.fst
    computation: verify_pkce_s256
    lemma: lemma_pkce_s256_binding
  - type: tamarin
    file: proofs/tamarin/pkce/pkce_security.spthy
    lemma: mismatched_verifiers_cannot_inject_codes
  tests:
  - crates/server/src/authcode/token/tests/token_exchange.rs
  - crates/server/tests/spec_oracle_test.rs
  ci_check: pkce-verification
  status: verified
  runtime_link: crates/server/src/authcode/mod.rs
  trace:
    kind: oracle
    fstar: fstar/pkce/Pkce.fst#verify_pkce_s256
    rust: crates/server/src/authcode/token.rs#verify_pkce
    test: crates/server/tests/spec_oracle_test.rs
- id: 7636-008
  section: '5'
  requirement: SHOULD
  description: Servers SHOULD publish supported PKCE methods in metadata
  module: crates/server/src/metadata.rs
  tests:
  - crates/server/src/authcode/token/tests/oidc_id_token.rs
  - crates/server/src/metadata.rs
  ci_check: pkce-metadata
  status: implemented
  runtime_link: crates/server/src/metadata.rs
rfc_7009:
- id: 7009-001
  section: '2'
  requirement: MUST
  description: Revocation endpoint MUST accept POST requests
  module: crates/server/src/web/token_lifecycle.rs
  proof:
  - type: policy
    rule: revocation_post_only
  tests:
  - crates/server/src/web/token_lifecycle/introspection.rs
  ci_check: revocation-post-only
  status: implemented
  notes:
  - Revocation endpoint rejects non-POST requests and enforces client authentication.
- id: 7009-002
  section: '2.1'
  requirement: MUST
  description: Revocation request MUST include token parameter
  module: fstar/revocation/Revocation.fst
  proof:
  - type: fstar
    file: fstar/revocation/Revocation.fst
    invariant: revocation_request
  tests:
  - crates/server/src/web/token_lifecycle/introspection.rs
  ci_check: revocation-request-format
  status: verified
  runtime_link: crates/server/src/web/token_lifecycle.rs
  trace:
    kind: guard
    fstar: fstar/revocation/Revocation.fst#revocation_request
    rust: crates/server/src/web/token_lifecycle/forms.rs#required_lifecycle_token
    test: crates/server/src/web/token_lifecycle/forms.rs
  notes:
  - Missing token parameter returns 400 invalid_request with issuer field.
- id: 7009-003
  section: '2.1'
  requirement: MUST
  description: Clients MUST authenticate for revocation
  module: fstar/revocation/Revocation.fst
  proof:
  - type: fstar
    invariant: lemma_revoke_token_idempotent
  - type: tamarin
    file: proofs/tamarin/revocation/revocation_auth.spthy
    lemma: authorized_revocation
  tests:
  - crates/server/src/web/token_lifecycle/introspection.rs
  ci_check: revocation-authentication
  status: verified
  runtime_link: crates/server/src/web/token_lifecycle.rs
  trace:
    kind: exempt
    note: "Tamarin protocol-level property (authorized_revocation); revocation client authentication is not modeled in F*."
  notes:
  - Invalid client credentials receive 401 with WWW-Authenticate challenge.
- id: 7009-004
  section: '2.2'
  requirement: MUST
  description: Server MUST respond with HTTP 200 for valid requests
  module: fstar/revocation/Revocation.fst
  proof:
  - type: fstar
    file: fstar/revocation/Revocation.fst
    invariant: revocation_response
  tests:
  - crates/server/src/web/token_lifecycle/introspection.rs
  ci_check: revocation-response
  status: partial
  runtime_link: crates/server/src/web/token_lifecycle.rs
  notes:
  - Revocation returns 200 for valid requests; invalid clients handled per RFC 7009.
- id: 7009-005
  section: '2.2'
  requirement: MUST
  description: Revocation MUST be idempotent
  module: fstar/revocation/Revocation.fst
  proof:
  - type: fstar
    file: fstar/revocation/Revocation.fst
    lemma: lemma_revoke_token_idempotent
  tests:
  - crates/server/src/web/token_lifecycle/introspection.rs
  - crates/server/tests/revocation_idempotency_test.rs
  ci_check: revocation-idempotent
  status: verified
  runtime_link: crates/server/src/web/token_lifecycle.rs
  trace:
    kind: guard
    fstar: fstar/revocation/Revocation.fst#lemma_revoke_token_idempotent
    rust: crates/server/src/authcode/store/revocation.rs#try_revoke_token_for_client
