rfc_9901:
- id: 9901-001
  requirement: MUST
  description: SD-JWT selective disclosure — Issuer, Holder, Verifier with SHA-256 disclosure digests and compound format serialization.
  module: crates/jose/src/sd_jwt.rs
  proof:
  - type: unit_test
    file: crates/jose/src/sd_jwt.rs
    count: 24
  - type: fstar
    file: fstar/jose/Jose.SdJwt.fst
    lemma: lemma_completeness, lemma_non_forgeability, lemma_soundness_subset, lemma_no_duplicate, lemma_reconstruction_subset
  - type: kani
    file: crates/kani-harness/src/lib.rs
    count: 6
  - type: tamarin
    file: proofs/tamarin/sd_jwt/sd_jwt_selective_disclosure.spthy
    lemma: disclosure_non_forgeability, selective_privacy, binding_integrity, no_disclosure_without_key, salt_uniqueness, no_disclosure_without_salt
    count: 6
  status: verified
  runtime_link: crates/jose/src/sd_jwt.rs
  trace:
    kind: guard
    fstar: fstar/jose/Jose.SdJwt.fst#lemma_completeness
    rust: crates/jose/src/sd_jwt.rs#issue
    test: crates/jose/src/sd_jwt.rs
  applies_to:
  - jose
  - server
  notes:
  - "SdJwtIssuer/SdJwtHolder/SdJwtVerifier implemented with 24 unit tests passing."
  - "Min 128-bit salt, max 256 disclosures, SHA-256 digest algorithm."
  - "F* specification (Jose.SdJwt.fst) completed: disclosure integrity, digest uniqueness, format serialization."
  - "Kani harnesses (6): disclosure_roundtrip, digest_uniqueness, issuer_payload, verifier_reconstruction, holder_selection, format_parsing."
  - "Tamarin model (6 lemmas): disclosure non-forgeability, selective privacy, binding integrity, key/salt requirements."

