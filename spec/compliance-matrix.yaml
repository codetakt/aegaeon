rfc_7523:
- id: 7523-001
  requirement: TRACKING
  description: Track RFC 7523 (JWT Profile for OAuth 2.0 Client Authentication and Authorization Grants), including JWT bearer grants and private_key_jwt/client_secret_jwt decisions.
  module: docs/program-management/roadmaps/active/oauth-rfc-coverage-roadmap.md
  status: implemented
  applies_to:
  - as
  - client
  notes:
  - "Client authentication via private_key_jwt is implemented through the management policy field `privateKeyJwtEnabled` and verified with tests + F* + Tamarin."
  - "client_secret_jwt is not implemented; metadata MUST NOT advertise it."
  - "JWT bearer authorization grants (grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer) are implemented behind the management policy `allowedGrantTypes` and verified with HTTP tests."
  - "DCR (RFC 7591) grant_types validation allows registering the jwt-bearer grant only when the active management policy `allowedGrantTypes` includes it; otherwise the registration request is rejected with invalid_client_metadata."
  - "Client-side JWT assertion usage is tracked in the OAuth client/RP roadmap (outside this repo)."

- id: 7523-101
  section: '2.2'
  requirement: MUST
  description: client_assertion_type MUST be "urn:ietf:params:oauth:client-assertion-type:jwt-bearer" when using a JWT for client authentication.
  module: crates/server/src/web/mod.rs
  proof:
  - type: tamarin
    file: proofs/tamarin/client_auth/private_key_jwt.spthy
    lemma: pkjwt_client_auth_integrity
  - type: policy
    rule: token_endpoint_accepts_only_jwt_bearer_assertion_type
  tests:
  - crates/server/src/web/request_admission.rs
  status: verified
  runtime_link: crates/server/src/web/mod.rs
  trace:
    kind: exempt
    note: "Tamarin protocol-level property (pkjwt_client_auth_integrity); the F* model does not model the client_assertion_type parameter constant."
  notes:
  - "Runtime gates private_key_jwt via the active management policy field `privateKeyJwtEnabled` and checks client_assertion_type before attempting validation."

- id: 7523-102
  section: '2.2'
  requirement: MUST NOT
  description: client_assertion MUST contain a single JWT and MUST NOT contain more than one JWT.
  module: crates/server/src/web/mod.rs
  proof:
  - type: tamarin
    file: proofs/tamarin/client_auth/private_key_jwt.spthy
    lemma: pkjwt_client_auth_integrity
  - type: policy
    rule: reject_duplicate_client_assertion_parameters
  tests:
  - crates/server/src/web/request_admission.rs
  status: verified
  runtime_link: crates/server/src/web/mod.rs
  trace:
    kind: exempt
    note: "Tamarin protocol-level property (pkjwt_client_auth_integrity); request-parameter multiplicity is enforced at request admission, with no F* function-level counterpart."
  notes:
  - "Token endpoint parses application/x-www-form-urlencoded as a list of key/value pairs to fail closed on duplicate client_assertion/client_assertion_type keys."

- id: 7523-111
  section: '2.1'
  requirement: MUST
  description: When using the JWT bearer grant, token requests MUST use grant_type "urn:ietf:params:oauth:grant-type:jwt-bearer" and include an assertion parameter.
  module: crates/server/src/web/mod.rs
  proof:
  - type: tamarin
    file: proofs/tamarin/jwt_bearer/jwt_bearer_security.spthy
    lemma: jwt_bearer_grant_integrity
  tests:
  - crates/server/src/authcode/token/tests/jwt_bearer.rs
  status: verified
  runtime_link: crates/server/src/web/mod.rs
  trace:
    kind: exempt
    note: "Tamarin protocol-level property (jwt_bearer_grant_integrity); the F* model does not model the grant_type parameter constant."
  applies_to:
  - as
  - client

- id: 7523-112
  section: '2.1'
  requirement: MUST NOT
  description: The assertion parameter MUST contain a single JWT and MUST NOT be specified multiple times.
  module: crates/server/src/web/mod.rs
  proof:
  - type: tamarin
    file: proofs/tamarin/jwt_bearer/jwt_bearer_security.spthy
    lemma: jwt_bearer_grant_integrity
  tests:
  - crates/server/src/authcode/token/tests/jwt_bearer.rs
  status: verified
  runtime_link: crates/server/src/web/mod.rs
  trace:
    kind: exempt
    note: "Tamarin protocol-level property (jwt_bearer_grant_integrity); request-parameter multiplicity is enforced at request admission, with no F* function-level counterpart."
  applies_to:
  - as
  - client

- id: 7523-113
  section: '3'
  requirement: MUST
  description: JWT bearer assertions MUST be signed and include iss/sub/aud/exp; the authorization server MUST reject invalid assertions with invalid_grant.
  module: crates/server/src/client_registry.rs
  proof:
  - type: fstar
    file: fstar/auth/Pkjwt.fst
    invariant: jwt_bearer_assertion_valid
  - type: tamarin
    file: proofs/tamarin/jwt_bearer/jwt_bearer_security.spthy
    lemma: jwt_bearer_unforgeability
  - type: tamarin
    file: proofs/tamarin/jwt_bearer/jwt_bearer_security.spthy
    lemma: jwt_bearer_grant_integrity
  tests:
  - crates/server/src/authcode/token/tests/jwt_bearer.rs
  status: verified
  runtime_link: crates/server/src/client_registry.rs
  trace:
    kind: guard
    fstar: fstar/auth/Pkjwt.fst#jwt_bearer_assertion_valid
    rust: crates/server/src/client_registry/assertions/jwt_bearer.rs#try_validate_jwt_bearer_grant_assertion
    test: crates/server/src/authcode/token/tests/jwt_bearer.rs
  applies_to:
  - as

- id: 7523-114
  section: '3'
  requirement: MAY
  description: Authorization server MAY prevent replay by maintaining the set of used jti values for the assertion validity window.
  module: crates/server/src/client_registry.rs
  proof:
  - type: fstar
    file: fstar/auth/Pkjwt.fst
    invariant: jwt_bearer_jti_single_use_within_window
  - type: tamarin
    file: proofs/tamarin/jwt_bearer/jwt_bearer_security.spthy
    lemma: jwt_bearer_no_replay
  tests:
  - crates/server/src/authcode/token/tests/jwt_bearer.rs
  status: verified
  runtime_link: crates/server/src/client_registry.rs
  applies_to:
  - as
  notes:
  - "Aegaeon enforces single-use jti within bounded management policy windows: policy.jwtBearerJtiWindowSeconds for JWT bearer and policy.pkjwtJtiWindowSeconds for private_key_jwt."
  - "Supported deployments require a dedicated shared assertion replay store via AEGAEON_CLIENT_ASSERTION_REPLAY_REDIS_URL; process-local replay fixtures are test-only and outside supported server deployments."

- id: 7523-115
  section: '2.1'
  requirement: MUST
  description: Authorization server MUST only advertise supported grant types; JWT bearer grant is advertised only when enabled.
  module: crates/server/src/metadata.rs
  tests:
  - crates/server/src/metadata/tests/runtime_snapshot.rs
  status: implemented
  applies_to:
  - as

- id: 7523-116
  section: '3'
  requirement: SHOULD
  description: When JWT bearer grant support includes RS256, the RS256 verification path SHOULD be brought inside the verification boundary as part of the RS256 Interop Slice.
  module: docs/verification/oidc/rs256-interop-slice.md
  proof:
  - type: fstar
    file: fstar/auth/Pkjwt.fst
    invariant: jwt_bearer_assertion_valid
  - type: fstar
    file: fstar/auth/Pkjwt.fst
    invariant: jwt_bearer_jti_single_use_within_window
  - type: tamarin
    file: proofs/tamarin/jwt_bearer/jwt_bearer_security.spthy
    lemma: jwt_bearer_unforgeability
  - type: tamarin
    file: proofs/tamarin/jwt_bearer/jwt_bearer_security.spthy
    lemma: jwt_bearer_grant_integrity
  - type: tamarin
    file: proofs/tamarin/jwt_bearer/jwt_bearer_security.spthy
    lemma: jwt_bearer_no_replay
  tests:
  - crates/server/src/client_registry/jwks_helpers_tests/registry_core.rs
  - crates/server/src/authcode/token/tests/jwt_bearer.rs
  - crates/jose/src/jws.rs
  - crates/jose/tests/wycheproof_rsa_pkcs1_test.rs
  - crates/crypto/src/signature.rs
  - tests/vectors/wycheproof/rsa_signature_2048_sha256_test.json
  status: verified
  runtime_link: crates/server/src/client_registry.rs
  applies_to:
  - as
  notes:
  - "Runtime routes `RS256` and explicitly policy-enabled `PS256` JWT bearer grant assertions through promoted verifier paths; `RS256` remains a boundary exception, while `PS256` verification routes to `Hacl_RSAPSS`."
  - "The shared RS256 verifier encodes RSA JWK components as SPKI and delegates PKCS#1 v1.5 SHA-256 verification to `aegaeon_crypto::signature::verify_rsa_pkcs1_sha256` / `aws-lc-rs`; Wycheproof RSA signature vectors are regression-tested by `crates/jose/tests/wycheproof_rsa_pkcs1_test.rs::wycheproof_rsa_pkcs1_sha256_vectors_follow_expected_results`."
  - "The narrow server-claim exception remains limited to `RS256`; `PS256` is a verified-backend strengthening, while broader RSA/JWT grant surfaces remain compat or rejected."

- id: 7523-201
  section: '3'
  requirement: MUST
  description: Client assertion JWT MUST contain an "iss" claim identifying the entity that issued the JWT.
  module: crates/server/src/client_registry.rs
  proof:
  - type: fstar
    file: fstar/auth/Pkjwt.fst
    invariant: pkjwt_requires_iss
  tests:
  - crates/server/src/client_registry/jwks_helpers_tests/registry_core.rs
  status: verified
  runtime_link: crates/server/src/client_registry.rs
  trace:
    kind: guard
    fstar: fstar/auth/Pkjwt.fst#pkjwt_requires_iss
    rust: crates/server/src/client_registry/assertions/private_key_jwt.rs#verify_private_key_jwt_claims
    test: crates/jose/tests/jwt_validate.rs
  notes:
  - "Aegaeon enforces a stricter profile: iss=sub=client_id for private_key_jwt."

- id: 7523-202
  section: '3'
  requirement: MUST
  description: For client authentication, the "sub" claim MUST be the OAuth client's client_id.
  module: crates/server/src/client_registry.rs
  proof:
  - type: fstar
    file: fstar/auth/Pkjwt.fst
    invariant: pkjwt_subject_is_client_id
  - type: tamarin
    file: proofs/tamarin/client_auth/private_key_jwt.spthy
    lemma: pkjwt_client_auth_integrity
  tests:
  - crates/server/src/client_registry/jwks_helpers_tests/registry_core.rs
  status: verified
  runtime_link: crates/server/src/client_registry.rs
  trace:
    kind: guard
    fstar: fstar/auth/Pkjwt.fst#pkjwt_subject_is_client_id
    rust: crates/server/src/client_registry/assertions/private_key_jwt.rs#private_key_jwt_subject_policy_matches
    test: crates/jose/tests/jwt_validate.rs
  notes:
  - "Runtime enforces sub==client_id and (by policy) iss==client_id."

- id: 7523-203
  section: '3'
  requirement: MUST
  description: JWT MUST contain an "aud" claim that identifies the authorization server as an intended audience; AS MUST reject JWTs missing its identity.
  module: crates/server/src/client_registry.rs
  proof:
  - type: fstar
    file: fstar/auth/Pkjwt.fst
    invariant: pkjwt_audience_matches_expected
  - type: tamarin
    file: proofs/tamarin/client_auth/private_key_jwt.spthy
    lemma: pkjwt_audience_binding
  tests:
  - crates/server/src/client_registry/jwks_helpers_tests/registry_core.rs
  status: verified
  runtime_link: crates/server/src/client_registry.rs
  trace:
    kind: guard
    fstar: fstar/auth/Pkjwt.fst#pkjwt_audience_matches_expected
    rust: crates/server/src/client_registry/assertions/private_key_jwt.rs#verify_private_key_jwt_claims
    test: crates/jose/tests/jwt_validate.rs
  notes:
  - "Aegaeon uses the token endpoint URL ({issuer}/token) as the expected audience identifier."

- id: 7523-204
  section: '3'
  requirement: MUST
  description: JWT MUST contain an "exp" claim; AS MUST reject expired JWTs (subject to allowable clock skew). Optional nbf/iat claims MUST be enforced when present.
  module: crates/server/src/client_registry.rs
  proof:
