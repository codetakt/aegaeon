- id: OIDC-1-009
  section: OIDC RP upstream token refresh
  requirement: SHOULD
  description: RP mode SHOULD support refreshing upstream IdP tokens using stored refresh_token from account_links
  module: crates/server/src/web/upstream_refresh.rs
  proof:
  - type: code_review
    detail: upstream_refresh/upstream_callback split handlers with id_token validation, token rotation, connection-current validation, and error handling
  - type: kani
    file: crates/kani-harness/src/bounded_upstream.rs
    count: 3
  - type: fstar
    file: fstar/federation/UpstreamRefresh.fst
    detail: "21 lemmas: env_scoping, link_key_invariant, issuer_binding, rotation_persisted, generation_increases, generation_stable, stale_rejected, double_rotation, connection_issuer_change_rejected, callback_inactive_connection_rejected, callback_issuer_drift_rejected, callback_client_auth_drift_rejected, user_subject_preserved, invalid_bearer, unscoped_bearer, cross_tenant, invalid_sig, issuer_mismatch, alg_unsupported, bad_id_token, all_invariants"
  tests:
  - crates/server/src/web/upstream_tests/id_token/decode.rs
  - crates/server/src/web/upstream_tests/id_token.rs
  - crates/server/src/web/upstream_refresh.rs
  - crates/server/src/web/upstream_refresh_links/query.rs
  - crates/server/src/web/upstream_callback.rs
  - crates/server/src/web/upstream_callback_connection.rs
  - crates/server/src/web/management/connections/preparation/update.rs
  ci_check: oidc-rp-upstream-refresh
  status: verified
  runtime_link: crates/server/src/web/upstream_refresh.rs
  notes:
  - "4 integration tests in upstream_refresh_test.rs (error paths)."
  - "12 e2e tests in upstream_e2e_test.rs (mock upstream IdP): callback happy-path, return_to redirect, state anti-replay, error cases, mock IdP validation."
  - "Kani harnesses (3): upstream_refresh_token_rotation, requires_valid_link, token_single_use; bounded model includes account-link connection binding and generation/CAS semantics."
  - "F* spec (UpstreamRefresh.fst): 21 lemmas covering env scoping, link key invariant, issuer binding, rotation persistence, generation tracking, stale rejection, connection issuer immutability, callback current-row admission, user subject preservation, bearer validation, cross-tenant isolation, signature/algorithm checks, and composite invariant."
  - "Runtime implementation is split across `upstream_refresh.rs`, `upstream_refresh_links/query.rs`, `upstream_callback.rs`, and `upstream_callback_connection.rs`; `web/mod.rs` only wires these modules into the router."
  - "Connection lifecycle/identity invariants are enforced by the management API, `connections_issuer_url_immutable` DB trigger, active/current account-link target lookup, and callback current-row validation before token exchange."
  - "POST /oauth/upstream/refresh endpoint accepts bearer token, looks up account_links for stored upstream refresh_token."
  - "Calls upstream IdP token endpoint with grant_type=refresh_token; supports client_secret_basic, client_secret_post, and public (none) auth."
  - "Validates refreshed id_token signature against bounded, non-authoritative cached upstream JWKS if present in response."
  - "Persists rotated upstream refresh_token to account_links when upstream IdP issues a new one, guarded by upstream_refresh_token_generation optimistic CAS and connection binding."
  - "Uses bounded NonAuthoritativeMetadataCache for upstream discovery and JWKS to avoid repeated fetches without making process-local cache authoritative."
  - "Comprehensive error handling: 401 (invalid bearer), 404 (no link/token), 502 (upstream failures), and 503 for transient PostgreSQL-backed repository/service unavailability after mandatory startup preflight succeeds."
- id: OIDC-1-010
  section: Verification boundary
  requirement: MUST
  description: The OP's mandatory-to-implement RS256 ID Token signing and verification path is a promoted boundary exception for the program's verified OIDC Core server claim
  module: docs/verification/oidc/rs256-required-slice.md
  proof:
  - type: fstar
    file: fstar/oidc/IdToken.Spec.fst
    invariant: oidc_token_prop
  - type: fstar
    file: fstar/HashComputation.Model.fst
    computation: compute_oidc_hash_bytes_tot
  - type: everparse
    spec: fstar/lowparse/IdTokenSchema.3d
    artefact: generated/everparse/IdTokenSchema.c
  - type: tamarin
    file: proofs/tamarin/oidc/oidc_core.spthy
    lemma: id_token_session_binding
  - type: tamarin
    file: proofs/tamarin/oidc/oidc_core.spthy
    lemma: token_binding_integrity
  - type: kani
    file: crates/ffi/src/id_token.rs
    harness: oidc_id_token_jwt_canonicalisation_no_panic
  tests:
  - crates/server/src/oidc/required_rs256.rs
  - crates/server/src/web/mod.rs
  - crates/server/src/authcode/token/tests/oidc_id_token.rs
  - crates/server/tests/oidc_hash_vectors.rs
  - crates/server/src/authcode/token/tests/oidc_id_token.rs
  - crates/jose/src/jws.rs
  - crates/jose/tests/wycheproof_rsa_pkcs1_test.rs
  - crates/crypto/src/signature.rs
  - tests/vectors/wycheproof/rsa_signature_2048_sha256_test.json
  ci_check: oidc-rs256-required-slice
  status: verified
  runtime_link: crates/server/src/oidc/required_rs256.rs
  trace:
    kind: guard
    fstar: fstar/oidc/IdToken.Spec.fst#oidc_token_prop
    rust: crates/server/src/oidc/required_rs256/verification.rs#verify_required_id_token_claims
    test: crates/server/src/oidc/required_rs256/tests.rs
  notes:
  - "The general verified allowlist remains modern-only (`HS*`, `EdDSA`). This row records a promoted OIDC-specific exception rather than a reclassification of broad RSA."
  - "Runtime carve-out is centralized in `crates/server/src/oidc/required_rs256.rs` and wired into OP issuance plus shared upstream/brokering validation helpers."
  - "Cryptographic hardness (EUF-CMA) and the `aws-lc-rs` RS256 verifier backend remain explicit assumptions / compat boundaries; the verified claim for this row is limited to the mandatory OIDC RS256 slice."
  - "The shared RS256 verifier encodes RSA JWK components as SPKI and delegates PKCS#1 v1.5 SHA-256 verification to `aegaeon_crypto::signature::verify_rsa_pkcs1_sha256`; Wycheproof RSA signature vectors are regression-tested by `crates/jose/tests/wycheproof_rsa_pkcs1_test.rs::wycheproof_rsa_pkcs1_sha256_vectors_follow_expected_results`."
  - "Fresh local evidence on 2026-03-09 is recorded under `artifacts/verification/oidc-rs256-required-slice/20260309T014321Z`, including targeted cargo tests for `required_rs256`, upstream decode helper coverage, `upstream_refresh_test`, compliance-matrix validation, targeted F* verification for `IdToken.Spec`, targeted Tamarin proofs for `id_token_session_binding` and `token_binding_integrity`, and the Kani harness `oidc_id_token_jwt_canonicalisation_no_panic` via `nix develop .#verification`."
