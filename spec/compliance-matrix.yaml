  module: crates/server/src/util.rs
  tests:
  - crates/server/src/web/resource_endpoint/policy.rs
  ci_check: oauth21-no-query-token
  status: implemented
  notes:
  - extract_bearer_token() only accepts Authorization header and form body, rejects query delivery.
  - reject_multiple_transport_methods test validates this constraint.
- id: v21-028
  section: '5.1'
  requirement: SHOULD
  description: Client SHOULD use Authorization header for Bearer token transmission
  module: crates/server/src/util.rs
  tests:
  - crates/server/src/web/resource_endpoint/policy.rs
  ci_check: oauth21-bearer-header
  status: implemented
  notes:
  - extract_bearer_token() prefers Authorization header. WWW-Authenticate header included in 401 responses.
- id: v21-029
  section: '5.3'
  requirement: SHOULD
  description: Resource server SHOULD include WWW-Authenticate header in 401 responses
  module: crates/server/src/util.rs
  tests:
  - crates/server/src/web/resource_endpoint/policy.rs
  ci_check: oauth21-www-authenticate
  status: implemented
  notes:
  - bearer_invalid_token_response() sets WWW-Authenticate header with Bearer scheme and error description.
- id: v21-030
  section: '7.5.1'
  requirement: MUST
  description: Public clients MUST use PKCE with authorization code flow
  module: crates/server/src/web/authorize_context.rs
  proof:
  - type: fstar
    file: fstar/jose/Jose.Dcr.fst
    invariant: validate_dcr_metadata_core
  - type: policy
    rule: require_pkce
  tests:
  - crates/server/src/config/tests/management_policy.rs
  ci_check: oauth21-public-client-pkce
  status: verified
  runtime_link: crates/server/src/web/authorize_context.rs
  trace:
    kind: guard
    fstar: fstar/authcode/AuthCode.Flow.fst#authorize
    rust: crates/server/src/authcode/token/authorization_code.rs#prepare_authorization_code_issue
    test: crates/server/src/web/token_exchange_tests/error_responses.rs
  notes:
  - policy.pkceRequired is projected from the active management snapshot into SecurityPolicy.require_pkce.
  - authorize_validate_policy combines the runtime policy and resolved OAuth profile to require PKCE for public clients.
  - authorize_requires_pkce_for_public_client test validates enforcement.
- id: v21-031
  section: '4.1.2'
  requirement: SHOULD
  description: Issuer identifier SHOULD be included in authorization responses to enable mix-up attack defense
  module: crates/server/src/web/mod.rs
  proof:
  - type: policy
    rule: require_iss_parameter
  tests:
  - crates/server/src/metadata/tests/core.rs
  ci_check: oauth21-iss-response
  status: implemented
  runtime_link: crates/server/src/web/mod.rs
  notes:
  - Draft §4.1.2 marks iss as OPTIONAL; §7.14.1 recommends it as a mix-up defense.
  - Aegaeon emits RFC 9207 issuer identifiers in authorization responses and validates issuer requirements through the resolved OAuth profile.
  - Authorization response always includes iss parameter.
- id: v21-032
  section: '7.13'
  requirement: MUST
  description: All OAuth protocol URLs MUST use https except loopback redirect URIs
  module: crates/server/src/dcr.rs
  proof:
  - type: policy
    rule: tls_required_all_endpoints
  tests:
  - crates/server/tests/tls_enforcement_test.rs
  - crates/server/src/config/tests/management_policy.rs
  ci_check: oauth21-https-all-urls
  status: implemented
  notes:
  - validate_redirect_uris() enforces HTTPS except for localhost/127.0.0.1.
  - Transport enforcement layer requires TLS for all protocol endpoints.
- id: v21-033
  section: '7.1.1'
  requirement: SHOULD
  description: Access tokens SHOULD be short-lived to limit exposure window
  module: crates/server/src/config/management_policy.rs
  proof:
  - type: policy
    rule: max_access_token_lifetime_seconds
  tests:
  - crates/server/src/web/resource_endpoint/policy.rs
  ci_check: oauth21-short-lived-tokens
  status: implemented
  notes:
  - Draft §7.1.1 uses SHOULD for short-lived bearer tokens.
  - PostgreSQL-backed management policy projects accessTokenTimeToLiveSeconds into ServerConfig.access_token_ttl_secs.
  - AccessToken.is_expired() enforces time-based validation.
- id: v21-034
  section: '7.1.3'
  requirement: SHOULD
  description: Sender-constrained tokens SHOULD be used via proof-of-possession mechanisms (DPoP/mTLS)
  module: crates/server/src/policy.rs
  proof:
  - type: tamarin
    file: proofs/tamarin/dpop/dpop_replay.spthy
    lemma: dpop_injective_agreement
  tests:
  - crates/server/src/middleware/dpop/tests.rs
  - crates/server/src/web/token_sender_binding.rs
  - crates/server/src/authcode/store/tests/sender_binding.rs
  ci_check: oauth21-sender-constrained
  status: verified
  runtime_link: crates/server/src/policy.rs
  notes:
  - SecurityPolicy.sender_constrained defaults to DPoP.
  - Both DPoP and mTLS binding supported and enforced.
- id: v21-035
  section: '2.3.4'
  requirement: MUST
  description: Clients interacting with multiple ASes MUST prevent mix-up attacks by validating issuer
  module: crates/server/src/web/mod.rs
  proof:
  - type: tamarin
    file: proofs/tamarin/oidc/iss_mixup.spthy
    lemma: no_issuer_mixup
  - type: policy
    rule: require_iss_parameter
  tests:
  - crates/server/src/metadata/tests/core.rs
  ci_check: oauth21-mixup-prevention
  status: verified
  runtime_link: crates/server/src/web/mod.rs
  trace:
    kind: exempt
    note: "Protocol-level property proven in Tamarin (no_issuer_mixup); no F* function-level counterpart for issuer comparison."
  notes:
  - RFC 9207 issuer identifier is emitted in authorization responses; profile issuer checks reject mismatched issuer requests.
- id: v21-036
  section: '3.2.1'
  requirement: MUST
  description: Confidential clients MUST authenticate with authorization server at token endpoint
  module: crates/server/src/web/mod.rs
  proof:
  - type: fstar
    file: fstar/auth/Pkjwt.fst
    invariant: validate_pkjwt
  tests:
  - crates/server/src/web/token_endpoint/client_auth.rs
  - crates/server/src/config/tests/management_policy.rs
  ci_check: oauth21-confidential-client-auth
  status: partial
  runtime_link: crates/server/src/web/mod.rs
  notes:
  - Token endpoint enforces client authentication per profile and client type.
  - Supports client_secret_basic, client_secret_post, and private_key_jwt when enabled.
  - tls_client_auth/self_signed_tls_client_auth are intentionally not advertised until RFC 8705 client authentication is implemented.
- id: v21-037
  section: '3.2.3'
  requirement: MUST
  description: Refresh tokens issued by token endpoint MUST be bound to the authorized scope
  module: crates/server/src/authcode/token.rs
  tests:
  - crates/server/src/authcode/store/tests/revocation_basic.rs
  ci_check: oauth21-refresh-scope-binding
  status: implemented
  runtime_link: crates/server/src/authcode/token.rs
  notes:
  - Token response binds refresh token to originally-consented scope.
  - Scope cannot be widened on subsequent refresh grants.
- id: v21-038
  section: '4.1.1'
  requirement: MUST
  description: Authorization code grant response_type MUST be "code"; no other response_type is defined
  module: crates/server/src/web/mod.rs
  proof:
  - type: policy
    rule: forbid_implicit_flow
  tests:
  - crates/server/src/config/tests/management_policy.rs
  - crates/server/src/web/token_exchange_tests/authorize_query.rs
  ci_check: oauth21-response-type-code
  status: implemented
  runtime_link: crates/server/src/web/mod.rs
  notes:
  - validate_authorize_request() rejects any response_type != "code" with unsupported_response_type.
  - Metadata advertises only ["code"] as response_types_supported.
- id: v21-039
  section: '2.3.2'
  requirement: MUST
  description: When multiple redirect URIs are registered, client MUST include redirect_uri in authorization request
  module: crates/server/src/web/mod.rs
  tests:
  - crates/server/src/web/token_exchange_tests/authorize_query.rs
  ci_check: oauth21-redirect-uri-required-multi
  status: implemented
  notes:
  - Authorization endpoint requires redirect_uri when client has multiple registered URIs.
  - Single-URI clients may omit redirect_uri per spec.
- id: v21-040
  section: '3.1'
  requirement: MUST
  description: Request and response parameters MUST NOT be included more than once
  module: crates/server/src/web/mod.rs
  tests:
  - crates/server/src/web/request_admission.rs
  ci_check: oauth21-no-duplicate-params
  status: partial
  notes:
  - Token endpoint uses take_param() with explicit duplicate detection (fully compliant).
  - Authorization endpoint uses serde_urlencoded last-value-wins, which silently deduplicates
    rather than rejecting. Duplicate rejection at /authorize is a known gap (Codex review H-8).
  - Gap accepted for Phase 9; /authorize duplicate detection planned for future hardening.
- id: v21-041
  section: '3.2'
  requirement: MUST
  description: Token endpoint MUST ignore unrecognized request parameters and reject duplicate parameters
  module: crates/server/src/web/mod.rs
  tests:
  - crates/server/src/web/request_admission.rs
  ci_check: oauth21-token-param-handling
  status: implemented
  notes:
  - Token endpoint deserializes known fields only; unknown fields are ignored.
  - take_param() detects and rejects duplicate parameters with invalid_request.
  - Parameters without values treated as omitted.
- id: v21-042
  section: '2.4.1'
  requirement: MUST
  description: Authorization server MUST support client credentials in request body (client_secret_post)
  module: crates/server/src/web/mod.rs
  tests:
  - crates/server/src/web/token_endpoint/client_auth.rs
  - crates/server/src/web/token_client_credentials.rs
  ci_check: oauth21-client-secret-post
  status: implemented
  notes:
  - Token endpoint accepts client_id + client_secret as form parameters (client_secret_post method).
  - Token endpoint client-auth parsing and client registry validation enforce client_secret_post admission.

openid_federation_op:
- id: fed-op-001
  section: '3.1'
  requirement: MUST
  description: Future active OP publication MUST self-sign Entity Configuration (iss == sub) and publish it at /.well-known/openid-federation
  module: crates/server/src/web/mod.rs
  proof:
  - type: fstar
    file: fstar/federation/OpEntityConfiguration.fst
    invariant: is_self_signed
  - type: kani
    file: crates/kani-harness/src/bounded_entity_config.rs
    harness: proof_ec1_self_signed
  - type: tamarin
    file: proofs/tamarin/federation/op_entity_configuration.spthy
    lemma: entity_config_self_signed
  tests:
  - crates/server/src/federation/tests/entity_statement.rs
  ci_check: federation-op-entity-config
  status: planned
  runtime_link: crates/server/src/web/mod.rs
  notes:
  - Public OpenID Federation OP runtime publication is not active in the verified server claim; current endpoint returns 404.
  - EC-1 security property. Structurally enforced by setting iss = sub = entity_id.
- id: fed-op-002
  section: '3.1'
  requirement: MUST
  description: Future active OP publication MUST include JWKS in Entity Configuration for signature verification (EC-2)
  module: crates/server/src/web/mod.rs
  proof:
  - type: fstar
    file: fstar/federation/OpEntityConfiguration.fst
    invariant: has_jwks
  - type: kani
    file: crates/kani-harness/src/bounded_entity_config.rs
    harness: proof_ec2_jwks_embedded
  tests:
  - crates/server/src/federation/tests/entity_statement.rs
  ci_check: federation-op-jwks-embedded
  status: planned
  runtime_link: crates/server/src/web/mod.rs
  notes:
  - Public OpenID Federation OP runtime publication is not active in the verified server claim; current endpoint returns 404.
  - JWKS embedded in payload so verifiers can validate the self-signed JWS.
- id: fed-op-003
  section: '3.1'
  requirement: MUST
  description: Future active OP publication MUST bound Entity Configuration exp to limit stale configuration windows (EC-3)
  module: crates/server/src/web/mod.rs
  proof:
  - type: fstar
    file: fstar/federation/OpEntityConfiguration.fst
    invariant: exp_within_bound
  - type: kani
    file: crates/kani-harness/src/bounded_entity_config.rs
    harness: proof_ec3_exp_bounded
  tests:
  - crates/server/src/federation/tests/entity_statement.rs
  ci_check: federation-op-exp-bounded
  status: planned
  runtime_link: crates/server/src/web/mod.rs
  notes:
  - Public OpenID Federation OP runtime publication is not active in the verified server claim; current endpoint returns 404.
  - Clamped to max 86400 seconds (24h). F* and Kani verify bound.
- id: fed-op-004
  section: '6'
  requirement: MUST
  description: Future active OP publication MUST return Entity Configuration with Content-Type application/entity-statement+jwt
  module: crates/server/src/web/mod.rs
  proof:
  - type: fstar
    file: fstar/federation/Federation.EntityConfig.fst
    invariant: lemma_self_signed
  - type: tamarin
    file: proofs/tamarin/federation/op_entity_configuration.spthy
    lemma: entity_config_integrity
  tests:
  - crates/server/src/federation/tests/entity_statement.rs
  ci_check: federation-op-content-type
  status: planned
  runtime_link: crates/server/src/web/mod.rs
  notes:
  - Public OpenID Federation OP runtime publication is not active in the verified server claim; current endpoint returns 404.
  - JOSE typ header set to entity-statement+jwt per OpenID Federation §3.
- id: fed-op-005
  section: '3.1'
  requirement: MUST
  description: Future active OP publication MUST include openid_provider and federation_entity metadata in Entity Configuration (EC-5)
  module: crates/server/src/web/mod.rs
  proof:
  - type: fstar
    file: fstar/federation/OpEntityConfiguration.fst
    invariant: has_required_metadata
  - type: kani
    file: crates/kani-harness/src/bounded_entity_config.rs
    harness: proof_ec5_metadata_present
  tests:
  - crates/server/src/federation/tests/entity_statement.rs
  ci_check: federation-op-metadata
  status: planned
  runtime_link: crates/server/src/web/mod.rs
  notes:
  - Public OpenID Federation OP runtime publication is not active in the verified server claim; current endpoint returns 404.
  - The structural builder can include openid_provider and federation_entity metadata, but public metadata emission is deferred until OP signing enters the verified runtime boundary.
- id: fed-op-006
  section: '7.1'
  requirement: MUST
  description: Future active Federation fetch endpoint MUST return subordinate statements with iss = OP entity_id (SS-1)
  module: crates/server/src/web/mod.rs
  proof:
  - type: fstar
    file: fstar/federation/OpSubordinateStatement.fst
