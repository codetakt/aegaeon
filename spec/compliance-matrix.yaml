rfc_7521:
- id: 7521-001
  requirement: TRACKING
  description: Track RFC 7521 assertion framework requirements for OAuth client authentication and authorization grants.
  module: docs/program-management/roadmaps/active/oauth-rfc-coverage-roadmap.md
  status: implemented
  applies_to:
  - as
  - client
  notes:
  - "Assertion-based client authentication is implemented for JWT assertions via RFC 7523 (private_key_jwt)."
  - "Assertion authorization grants are supported for JWT bearer (RFC 7523) when the management policy `allowedGrantTypes` includes `urn:ietf:params:oauth:grant-type:jwt-bearer`; other assertion types are not supported."
  - "Client-side assertion usage is tracked in the OAuth client/RP roadmap (outside this repo)."

