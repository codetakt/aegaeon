[package]
name = "xtask"
version = "0.9.0-beta"
edition = "2021"
license = "Apache-2.0"
description = "Workspace automation tasks for Aegaeon"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
openapi = ["dep:aegaeon-server", "dep:serde_json"]

[dependencies]
anyhow = "1.0"
serde_json = { version = "1.0", optional = true }
aegaeon-server = { path = "../crates/server", version = "0.9.0-beta", features = ["openapi"], optional = true }
