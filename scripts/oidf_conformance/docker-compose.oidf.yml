name: aegaeon-oidf

services:
  postgres:
    image: postgres:${AEGAEON_POSTGRES_IMAGE_TAG:-18.1}
    environment:
      POSTGRES_DB: aegaeon
      POSTGRES_USER: aegaeon
      POSTGRES_PASSWORD: aegaeon
    volumes:
      - oidf_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegaeon -d aegaeon"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:6
    volumes:
      - oidf_mongo_data:/data/db

  suite:
    build:
      context: ./suite
      args:
        # Override if you want to pin a specific suite ref.
        SUITE_REF: ${SUITE_REF:-master}
    depends_on:
      - mongo
    environment:
      SUITE_PORT: "8080"
      SUITE_BASE_URL: ${SUITE_PUBLIC_BASE_URL}
      MONGODB_URI: mongodb://mongo:27017/conformance
    expose:
      - "8080"

  aegaeon:
    image: ${AEGAEON_IMAGE:-aegaeon:latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Aegaeon uses `RUST_LOG` (EnvFilter) for logging.
      RUST_LOG: ${AEGAEON_RUST_LOG:-info}
      # Select the active management-database runtime by issuer_host. This must match
      # the host portion of AEGAEON_PUBLIC_BASE_URL and the seeded Environment issuer_host.
      AEGAEON_RUNTIME_ISSUER_HOST: ${AEGAEON_RUNTIME_ISSUER_HOST:?set issuer host matching AEGAEON_PUBLIC_BASE_URL}
      # PostgreSQL is mandatory. Apply migrations and seed the active management
      # runtime configuration for ${AEGAEON_PUBLIC_BASE_URL} before starting this service.
      AEGAEON_DATABASE_URL: postgres://aegaeon:aegaeon@postgres:5432/aegaeon?sslmode=disable
      # Trust the nginx container as a reverse proxy in typical Docker networks.
      # Override if you use a different address space.
      AEGAEON_TRUSTED_PROXIES: ${AEGAEON_TRUSTED_PROXIES:-172.16.0.0/12,127.0.0.1/32,::1/128}
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - aegaeon
      - suite
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:${NGINX_HTTPS_PORT:-443}"
    environment:
      AEGAEON_DOMAIN: ${AEGAEON_DOMAIN}
      SUITE_DOMAIN: ${SUITE_DOMAIN}
      CERT_PRIMARY_DOMAIN: ${CERT_PRIMARY_DOMAIN}
      NGINX_HTTPS_PORT: ${NGINX_HTTPS_PORT:-443}
    volumes:
      - oidf_letsencrypt:/etc/letsencrypt:ro
      - ./nginx/oidf.conf.template:/etc/nginx/templates/oidf.conf.template:ro
    networks:
      default:
        aliases:
          - ${AEGAEON_DOMAIN}
          - ${SUITE_DOMAIN}

  # Optional: obtain/renew a SAN cert via DNS-01.
  # Run once with:
  #   docker compose -f scripts/oidf_conformance/docker-compose.oidf.yml --env-file scripts/oidf_conformance/.env --profile acme run --rm acme
  acme:
    profiles: ["acme"]
    image: goacme/lego:v4.16.1
    environment:
      LEGO_EMAIL: ${LEGO_EMAIL}
      LEGO_DNS: ${LEGO_DNS}
      # Route53 credentials (see `.env.example` / README)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-${AWS_REGION:-us-east-1}}
      AWS_HOSTED_ZONE_ID: ${AWS_HOSTED_ZONE_ID:-}
    volumes:
      - oidf_letsencrypt:/etc/letsencrypt
    command: >
      sh -lc
      "lego
      --path /etc/letsencrypt
      --email \"${LEGO_EMAIL}\"
      --dns \"${LEGO_DNS}\"
      --domains \"${AEGAEON_DOMAIN}\"
      --domains \"${SUITE_DOMAIN}\"
      --accept-tos
      run"

volumes:
  oidf_postgres_data:
  oidf_mongo_data:
  oidf_letsencrypt:
