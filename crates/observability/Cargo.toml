[package]
name = "aegaeon-observability"
version = "0.9.0-beta"
edition = "2021"
license = "Apache-2.0"
description = "Observability components for Aegaeon services"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-opentelemetry = "0.31"
opentelemetry = { version = "0.30", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.30", features = ["rt-tokio", "metrics", "trace"] }

# Metrics
prometheus = "0.14"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

# Async runtime
tokio = { version = "1.41", features = ["full"] }
hyper = { version = "1.4", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
http = "1.1"
http-body-util = "0.1"

# Error handling
anyhow = "1.0"
thiserror = "2.0"
