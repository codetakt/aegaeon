[package]
name = "aegaeon-client"
version = "0.9.0-beta"
edition = "2021"
license = "Apache-2.0"
description = "Client-side TLS and HTTP helpers for Aegaeon"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
rustls-pemfile = "2.0"
thiserror = "2.0"

[dev-dependencies]
rcgen = "0.12"
