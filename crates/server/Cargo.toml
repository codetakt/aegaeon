[package]
name = "aegaeon-server"
version = "0.9.0-beta"
edition = "2021"
license = "Apache-2.0"
description = "OAuth 2.1 and OpenID Connect server for the Aegaeon identity platform"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["telemetry"]
telemetry = []  # Telemetry is always enabled via aegaeon-observability
# Optional KMS backend for production. Disabled by default to keep CI/Docker builds fast.
kms-aws = ["dep:aws-config", "dep:aws-sdk-kms"]
openapi = ["dep:utoipa"]
verified-claim = ["ffi/verified-claim", "aegaeon-jose/verified-claim"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dependencies]
ffi = { path = "../ffi", version = "0.9.0-beta" }
aegaeon-pure = { path = "../pure", version = "0.1.0" }
aegaeon-crypto = { path = "../crypto", version = "0.9.0-beta" }
http = "1.1"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
pem = "3"
simple_asn1 = "0.6"
aws-config = { version = "1.8.15", optional = true, default-features = false, features = [
    "default-https-client",
    "rt-tokio",
    "credentials-process",
    "sso",
] }
aws-sdk-kms = { version = "1.104.0", optional = true, default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
tokio = { version = "1.41", features = ["rt-multi-thread", "sync", "macros"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
] }
aegaeon-observability = { path = "../observability", version = "0.9.0-beta" }
uuid = { version = "1.10", features = ["v4"] }
anyhow = "1.0"
axum = "0.7"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.5", features = ["derive"] }
prometheus = "0.14"
jsonwebtoken = { version = "9.3", default-features = false, features = ["use_pem"] }
once_cell = "1.20"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
url = "2.5"
ipnet = "2.11"
aegaeon-jose = { path = "../jose", version = "0.9.0-beta" }
thiserror = "2.0"
utoipa = { version = "5.4.0", optional = true }
argon2 = "0.5"
tower-http = { version = "0.5", features = ["cors"] }
redis = { version = "0.27", features = ["tokio-rustls-comp"] }
csv = "1.3"
aws-lc-rs = "1.16.2"
ring = "0.17"

[dev-dependencies]
quickcheck = "1.0"
quickcheck_macros = "1.0"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
getrandom = "0.2"
