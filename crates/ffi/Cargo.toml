[package]
name = "ffi"
version = "0.9.0-beta"
edition = "2021"
license = "Apache-2.0"
description = "Rust and C FFI bridge for Aegaeon verified parsing and crypto components"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
aegaeon-jose-tlv = { path = "../jose-tlv", version = "0.9.0-beta" }
base64 = "0.22"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = "2"
hmac = "0.12"
chacha20poly1305 = "0.10"
aws-lc-rs = { version = "1.16.2", optional = true }

[build-dependencies]
cbindgen = "0.29"
cc = "1.0"
pkg-config = "0.3"

[dev-dependencies]
rand = "0.8"

[features]
default = []
aws-lc-tests = ["aws-lc-rs"]
kani = []
# Optional flags to include EverParse/Low* artefacts; disabled by default.
everparse_idtoken = []
lowstar_hash = []
idtoken_runtime = []
# Marker for the non-default claim-bearing profile.
# The profile currently enables the OIDC hash runtime shim plus the EverParse
# ID Token structure parser, and remains stricter than the default
# compatibility surface, but it still does not by itself prove full extraction
# closure.
verified-claim = ["lowstar_hash", "everparse_idtoken"]
