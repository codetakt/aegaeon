[package]
name = "aegaeon-crypto"
version = "0.9.0-beta"
edition = "2021"
license = "Apache-2.0"
description = "Unified crypto abstraction layer for Aegaeon"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
sha2 = "0.10"
getrandom = "0.2"
ring = "0.17"
aws-lc-rs = "1.16.2"
p256 = "0.13"
hmac = "0.12"
base64 = "0.22"
thiserror = "2.0"
rustls = { version = "0.23", default-features = false, features = [
    "aws_lc_rs",
    "std",
    "tls12",
] }
