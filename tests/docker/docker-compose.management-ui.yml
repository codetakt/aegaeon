name: aegaeon-management-ui

services:
  # PostgreSQL for management-plane persistence.
  postgres:
    image: postgres:${AEGAEON_POSTGRES_IMAGE_TAG:-18.1}
    ports:
      - "${AEGAEON_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: aegaeon
      POSTGRES_USER: aegaeon
      POSTGRES_PASSWORD: aegaeon
    volumes:
      # PostgreSQL 18+ stores clusters under /var/lib/postgresql/<major>/data.
      # Mounting the parent directory keeps the layout compatible with pg_upgrade workflows.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegaeon -d aegaeon"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Aegaeon server exposing the management API under /api/v1/*.
  #
  # Build the image via Nix first:
  #   nix run .#docker-build
  #
  # Or set AEGAEON_IMAGE to a prebuilt image name.
  aegaeon:
    image: ${AEGAEON_IMAGE:-aegaeon:latest}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${AEGAEON_HTTP_PORT:-8080}:8080"
    environment:
      RUST_LOG: ${AEGAEON_RUST_LOG:-info}
      # Selects the active management-database runtime environment by issuer_host.
      # Seed this environment with aegaeon-hosted-bootstrap or management DB fixtures before start.
      AEGAEON_RUNTIME_ISSUER_HOST: ${AEGAEON_RUNTIME_ISSUER_HOST:-localhost:${AEGAEON_HTTP_PORT:-8080}}

      # PostgreSQL is mandatory; runtime policy is loaded from management DB rows.
      AEGAEON_DATABASE_URL: postgres://aegaeon:aegaeon@postgres:5432/aegaeon?sslmode=disable

      # Management plane system settings. Origin allowlists and issuer base-domain defaults
      # are loaded from aegaeon.control_plane_policies, not startup environment variables.
      # Local development typically runs over HTTP.
      AEGAEON_MANAGEMENT_COOKIE_SECURE: ${AEGAEON_MANAGEMENT_COOKIE_SECURE:-0}
      # Optional: protect one-time owner bootstrapping.
      AEGAEON_MANAGEMENT_BOOTSTRAP_TOKEN: ${AEGAEON_MANAGEMENT_BOOTSTRAP_TOKEN:-}

volumes:
  postgres-data:
