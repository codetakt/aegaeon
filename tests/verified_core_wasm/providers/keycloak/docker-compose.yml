services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.3
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --hostname-strict=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "${AEGAEON_EXTERNAL_PROVIDER_KEYCLOAK_PORT:-35557}:8080"
    volumes:
      - "${AEGAEON_EXTERNAL_PROVIDER_KEYCLOAK_REALM_PATH:-./keycloak-realm.json}:/opt/keycloak/data/import/aegaeon-realm.json:ro"
