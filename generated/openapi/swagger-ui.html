<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aegaeon OpenAPI</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/swagger-ui-dist@5.31.0/swagger-ui.css"
    />
    <style>
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5.31.0/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.31.0/swagger-ui-standalone-preset.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        // Disable the remote validator (keeps this page usable in offline/restricted environments).
        validatorUrl: null,
        urls: [
          {
            url: "./aegaeon-management-api.v1.json",
            name: "Aegaeon Management API v1",
          },
          {
            url: "./aegaeon-ops.v1.json",
            name: "Aegaeon Ops API v1",
          },
        ],
        dom_id: "#swagger-ui",
        deepLinking: true,
        displayRequestDuration: true,
        filter: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: "StandaloneLayout",
      });
    </script>
  </body>
</html>
