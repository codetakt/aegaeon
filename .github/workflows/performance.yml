# Functional load smoke, observability and coverage; no performance qualification.
# Schedule (daily 2 AM UTC): functional load smoke + observability + coverage.
# Push to main: observability + coverage (no load tests).
# PR: performance remains deferred; PR applicability is owned by pr.yml.
# Manual dispatch: set run_load_tests=true to include functional load smoke.
name: Functional load and observability

on:
  push:
    branches: [ main ]
  schedule:
    # Daily regression: functional load smoke + observability + coverage
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_load_tests:
        description: "Run functional load smoke (heavy)"
        required: false
        default: "false"

concurrency:
  group: perf-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_INCREMENTAL: "0"
  # Separate supplier/runtime acceptance must replace this pending hold.
  POLICY_MIXED_PREREQUISITES: pending

jobs:
  # Load Testing
  load-test:
    name: Functional load smoke
    # Runs on schedule (daily regression) and on manual dispatch with run_load_tests.
    if: >-
      ${{
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.run_load_tests == 'true')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AEGAEON_RUNTIME_ISSUER_HOST: "127.0.0.1:18095"
      AEGAEON_DATABASE_URL: "postgres://aegaeon:aegaeon@127.0.0.1:5432/aegaeon?sslmode=disable"
      DATABASE_URL: "postgres://aegaeon:aegaeon@127.0.0.1:5432/aegaeon?sslmode=disable"
      AEGAEON_AUTH_CODE_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_AUTH_SESSION_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_CLIENT_ASSERTION_REPLAY_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_DEVICE_CODE_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_DEVICE_CSRF_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_DEVICE_RATE_LIMIT_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_DPOP_NONCE_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_DPOP_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_JWKS_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_LOCAL_AUTH_CSRF_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_LOCAL_LOGIN_RATE_LIMIT_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_MANAGEMENT_LOGIN_RATE_LIMIT_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_MANAGEMENT_SESSION_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_OIDC_LOGOUT_SESSION_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_PAR_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_REQUEST_OBJECT_JTI_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_STEPUP_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_TOKEN_STORE_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_UPSTREAM_AUTH_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_UPSTREAM_LOGOUT_RELAY_REDIS_URL: "redis://127.0.0.1:6379/0"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: aegaeon
          POSTGRES_PASSWORD: aegaeon
          POSTGRES_DB: aegaeon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegaeon -d aegaeon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Nix CI
        uses: ./.github/actions/setup-nix-ci
        with:
          free-disk: "true"
          enable-flakehub-cache: "true"

      - name: Prepare public smoke runtime
        run: |
          set -euo pipefail
          source_root="$PWD"
          preparation_root="$(mktemp -d)"
          trap 'rmdir "$preparation_root"' EXIT
          # Enter the shell outside Git so interactive hook setup cannot add
          # untracked inputs before the load application's source admission.
          (
            cd "$preparation_root"
            # The child shell expands its own positional source-root argument.
            # shellcheck disable=SC2016
            nix develop "$source_root#ci" --command bash -euo pipefail -c '
              cd "$1"
              atlas migrate apply --env local --revisions-schema public
              cargo build --release --locked --bin aegaeon-observability-seed
            ' bash "$source_root"
          )
          # The loopback OIDC-off fixture is sufficient for health/version smoke.
          api_key="aeg_$(openssl rand -hex 32)"
          echo "::add-mask::${api_key}"
          mkdir -p artifacts/perf/ci-load-smoke
          RUST_LOG=off AEGAEON_OBSERVABILITY_API_KEY="${api_key}" \
            ./target/release/aegaeon-observability-seed \
            > artifacts/perf/ci-load-smoke/runtime-seed.json
          python3 -m json.tool artifacts/perf/ci-load-smoke/runtime-seed.json > /dev/null

      - name: Run public smoke load test
        env:
          PERF_MANAGE_SERVER: "1"
          PERF_SCENARIO: smoke
          # Public-only loopback fixture uses the documented direct HTTP development policy.
          AEGAEON_POLICY_REQUIRE_TRUSTED_PROXY: "0"
          AEGAEON_REQUIRE_TLS_PROXY: "0"
          PERF_WORKERS: "2"
          PERF_RPS: "4"
          PERF_RUN_TIME: 4s
          PERF_WARMUP: "2"
          PERF_SERVER_PORT: "18095"
          AEGAEON_RUNTIME_ISSUER_HOST: "127.0.0.1:18095"
          AEGAEON_DATABASE_URL: "postgres://aegaeon:aegaeon@127.0.0.1:5432/aegaeon?sslmode=disable"
          PERF_APPLY_DATABASE_MIGRATIONS: "0"
          ARTIFACT_DIR: artifacts/perf/ci-load-smoke
          REPORT_PATH: artifacts/perf/ci-load-smoke/report.json
          LEGACY_REPORT: artifacts/load-test-report.json
        run: |
          nix run .#perf-load -- --functional-only

      - name: Validate public functional smoke
        run: |
          python3 ci/validate_load_smoke.py artifacts/perf/ci-load-smoke/report.json

      - name: Report pending policy-mixed prerequisites
        if: ${{ always() && env.POLICY_MIXED_PREREQUISITES != 'accepted' }}
        run: |
          echo "::notice::policy-mixed pending: activated HTTPS, client profile, public-login session and supplier prerequisites await separate acceptance"
          echo "policy-mixed: pending prerequisites; execution and SLO acceptance skipped" >> "$GITHUB_STEP_SUMMARY"

      - name: Run policy-mixed load smoke
        if: ${{ env.POLICY_MIXED_PREREQUISITES == 'accepted' }}
        env:
          PERF_MANAGE_SERVER: "1"
          PERF_SCENARIO: policy-mixed
          PERF_WORKERS: "2"
          PERF_RPS: "4"
          PERF_RUN_TIME: 4s
          PERF_WARMUP: "1"
          PERF_SERVER_PORT: "18096"
          AEGAEON_RUNTIME_ISSUER_HOST: "127.0.0.1:18096"
          AEGAEON_DATABASE_URL: "postgres://aegaeon:aegaeon@127.0.0.1:5432/aegaeon?sslmode=disable"
          PERF_APPLY_DATABASE_MIGRATIONS: "0"
          ARTIFACT_DIR: artifacts/perf/ci-policy-mixed
          REPORT_PATH: artifacts/perf/ci-policy-mixed/report.json
          LEGACY_REPORT: artifacts/policy-mixed-report.json
        run: |
          nix run .#perf-load -- --functional-only

      - name: Validate policy-mixed functional smoke
        if: ${{ env.POLICY_MIXED_PREREQUISITES == 'accepted' }}
        run: |
          python3 ci/validate_load_smoke.py artifacts/perf/ci-policy-mixed/report.json

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-test-results
          path: |
            artifacts/load-test-report.json
            artifacts/policy-mixed-report.json
            artifacts/perf/ci-load-smoke/
            artifacts/perf/ci-policy-mixed/

  # Observability Testing
  observability-test:
    name: Observability Verification
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AEGAEON_RUNTIME_ISSUER_HOST: "127.0.0.1:8080"
      AEGAEON_DATABASE_URL: "postgres://aegaeon:aegaeon@127.0.0.1:5432/aegaeon?sslmode=disable"
      DATABASE_URL: "postgres://aegaeon:aegaeon@127.0.0.1:5432/aegaeon?sslmode=disable"
      AEGAEON_AUTH_CODE_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_AUTH_SESSION_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_CLIENT_ASSERTION_REPLAY_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_DEVICE_CODE_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_DEVICE_CSRF_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_DEVICE_RATE_LIMIT_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_DPOP_NONCE_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_DPOP_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_JWKS_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_LOCAL_AUTH_CSRF_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_LOCAL_LOGIN_RATE_LIMIT_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_MANAGEMENT_LOGIN_RATE_LIMIT_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_MANAGEMENT_SESSION_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_OIDC_LOGOUT_SESSION_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_PAR_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_REQUEST_OBJECT_JTI_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_STEPUP_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_TOKEN_STORE_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_UPSTREAM_AUTH_REDIS_URL: "redis://127.0.0.1:6379/0"
      AEGAEON_UPSTREAM_LOGOUT_RELAY_REDIS_URL: "redis://127.0.0.1:6379/0"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: aegaeon
          POSTGRES_PASSWORD: aegaeon
          POSTGRES_DB: aegaeon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegaeon -d aegaeon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      prometheus:
        image: prom/prometheus:latest
        ports:
          - 9090:9090
      grafana:
        image: grafana/grafana:latest
        ports:
          - 3000:3000
      jaeger:
        image: jaegertracing/all-in-one:latest
        ports:
          - 16686:16686
          - 14268:14268

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Nix CI
        uses: ./.github/actions/setup-nix-ci
        with:
          free-disk: "true"
          enable-flakehub-cache: "true"

      - name: Configure Prometheus
        run: |
          cat > prometheus.yml << EOF
          global:
            scrape_interval: 15s
          scrape_configs:
            - job_name: 'aegaeon'
              static_configs:
                - targets: ['localhost:8080']
          EOF

      - name: Apply database migrations
        run: |
          set -euo pipefail
          nix develop .#ci --command bash -c \
            'atlas migrate apply --env local --revisions-schema public'

      - name: Build with telemetry
        run: |
          set -euo pipefail
          package=$(nix build .#server --no-link --print-out-paths)
          test -x "$package/bin/aegaeon-server"
          test -x "$package/bin/aegaeon-observability-seed"
          echo "AEGAEON_TELEMETRY_PACKAGE=$package" >> "$GITHUB_ENV"

      - name: Seed observability runtime configuration
        run: |
          set -euo pipefail
          api_key="aeg_$(openssl rand -hex 32)"
          echo "::add-mask::${api_key}"
          echo "AEGAEON_OBSERVABILITY_API_KEY=${api_key}" >> "${GITHUB_ENV}"
          AEGAEON_OBSERVABILITY_API_KEY="${api_key}" \
            "${AEGAEON_TELEMETRY_PACKAGE}/bin/aegaeon-observability-seed"

      - name: Start server with telemetry
        run: |
          set -euo pipefail
          env -u BASE_URL \
          RUST_LOG=info \
          OTEL_EXPORTER_JAEGER_ENDPOINT=http://localhost:14268/api/traces \
          "${AEGAEON_TELEMETRY_PACKAGE}/bin/aegaeon-server" &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> "${GITHUB_ENV}"
          ready=0
          for i in {1..30}; do
            if curl -f http://localhost:8080/health 2>/dev/null; then
              echo "Server is ready"
              ready=1
              break
            fi
            if ! kill -0 "${SERVER_PID}" 2>/dev/null; then
              echo "Server exited before becoming ready"
              wait "${SERVER_PID}" || true
              exit 1
            fi
            echo "Waiting for server to start... ($i/30)"
            sleep 1
          done
          if [[ "${ready}" -ne 1 ]]; then
            echo "Server did not become ready within 30 seconds"
            exit 1
          fi

      - name: Generate traffic for metrics
        run: |
          for _ in {1..20}; do
            curl -s -o /dev/null \
              -H "Authorization: Bearer invalid-token" \
              http://localhost:8080/resource || true
            curl -s -o /dev/null \
              -H "Authorization: DPoP invalid-token" \
              -H "DPoP: invalid-proof" \
              http://localhost:8080/resource || true
          done

      - name: Verify metrics exported
        run: |
          curl -fsS \
            -H 'Forwarded: for=127.0.0.1;proto=https' \
            -H "Authorization: Bearer ${AEGAEON_OBSERVABILITY_API_KEY}" \
            http://localhost:8080/api/v1/operations/metrics > metrics.prom
          grep -E "oauth_dpop_failure_rate|oauth_par_usage_rate|oauth_pkce_mismatch_rate" metrics.prom

          # Check health endpoint
          curl -f http://localhost:8080/health

      - name: Check trace data
        run: |
          # Query Jaeger for traces
          curl -s http://localhost:16686/api/traces?service=aegaeon-server | jq '.data[0]'

      - name: Stop server
        if: always()
        run: kill ${{ env.SERVER_PID }} || true

  # Code Coverage
  coverage:
    name: Code Coverage Analysis
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Nix CI
        uses: ./.github/actions/setup-nix-ci
        with:
          free-disk: "true"
          enable-flakehub-cache: "true"

      - name: Run tests with coverage
        run: |
          nix develop .#ci --command cargo llvm-cov --workspace --lcov --output-path lcov.info
          test -s lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./lcov.info
          disable_search: true
          plugins: noop
          flags: unittests
          name: codecov-umbrella

      - name: Check coverage threshold
        run: |
          nix develop .#ci --command bash <<'EOF'
          set -euo pipefail
          COVERAGE=$(awk -F: '
            BEGIN { lines_found = 0; lines_hit = 0 }
            /^LF:/ { lines_found += $2 }
            /^LH:/ { lines_hit += $2 }
            END {
              if (lines_found == 0) {
                print "0.00"
              } else {
                printf "%.2f", (lines_hit / lines_found) * 100
              }
            }
          ' lcov.info)
          echo "Coverage: ${COVERAGE}%"
          if ! awk -v coverage="$COVERAGE" 'BEGIN { exit (coverage >= 40 ? 0 : 1) }'; then
            echo "Coverage ${COVERAGE}% is below 40% threshold"
            exit 1
          fi
          EOF
