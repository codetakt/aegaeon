name: Security Suite

on:
  push:
    branches: [ main ]
  workflow_call:
  schedule:
    - cron: '0 0 * * 0'

env:
  NIX_CONFIG: experimental-features = nix-command flakes
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CORPUS_ARCHIVE_KEEP: 1
  CORPUS_HISTORY_KEEP: 100

jobs:
  security-stage:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - stage: supply-chain
            label: Security / Supply Chain
            timeout: 45
            command: nix run .#security-suite -- --stage supply-chain
          - stage: runtime-tests
            label: Security / Runtime Tests
            timeout: 45
            command: nix run .#security-suite -- --stage runtime-tests
          - stage: jose-boundaries
            label: Security / JOSE Boundaries
            timeout: 45
            command: nix run .#security-suite -- --stage jose-boundaries
          - stage: cargo-vet
            label: Security / Cargo Vet
            timeout: 35
            command: nix run .#security-suite -- --stage cargo-vet
          - stage: fuzz
            label: Security / Fuzz Smoke
            timeout: 40
            command: nix run .#security-suite -- --stage fuzz
          - stage: sanitizers
            label: Security / Sanitizers
            timeout: 45
            command: nix run .#security-suite -- --stage sanitizers
          - stage: sbom
            label: Security / SBOM
            timeout: 75
            command: nix run .#security-suite -- --stage sbom
          - stage: geiger
            label: Security / Cargo Geiger
            timeout: 90
            command: nix run .#security-suite -- --stage geiger
          - stage: udeps
            label: Security / Cargo Udeps
            timeout: 45
            command: nix run .#security-suite -- --stage udeps
          - stage: generated-artefacts
            label: Security / Generated Artefacts
            timeout: 45
            command: |
              if command -v sudo >/dev/null 2>&1; then
                sudo rm -rf /homeless-shelter || true
              else
                rm -rf /homeless-shelter || true
              fi
              nix run .#verify-lowstar
    timeout-minutes: ${{ matrix.timeout }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix CI
        uses: ./.github/actions/setup-nix-ci
        with:
          free-disk: "true"
          enable-flakehub-cache: "true"

      - name: Run security stage
        id: run_security_stage
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo rm -rf /homeless-shelter || true
          else
            rm -rf /homeless-shelter || true
          fi
          ${{ matrix.command }}

      - name: Cleanup transient outputs
        if: always()
        run: |
          # Fuzz cleanup belongs to the validated, receipt-bound wrapper.
          if [ "${{ matrix.stage }}" != "fuzz" ]; then
            rm -rf target fuzz/target || true
            rm -rf fuzz/corpus fuzz/corpus_archive fuzz/artifacts || true
            rm -rf ~/.cache/trivy ~/.cache/grype || true
          fi

      - name: Record security status
        if: always()
        run: |
          mkdir -p security-artifacts
          timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '%s\n' \
            '{"workflow":"${{ github.workflow }}",'\
            '"stage":"${{ matrix.stage }}",'\
            '"run_id":"${{ github.run_id }}",'\
            '"run_number":"${{ github.run_number }}",'\
            '"sha":"${{ github.sha }}",'\
            '"ref":"${{ github.ref }}",'\
            '"event":"${{ github.event_name }}",'\
            '"timestamp":"'"${timestamp}"'",'\
            '"job_status":"${{ job.status }}"}' \
            > security-artifacts/security_status.jsonl

      - name: Generate job summary
        if: always()
        run: |
          {
            echo "## Security Suite Summary"
            echo ""
            echo "- Stage: \`${{ matrix.stage }}\`"
            echo "- Job status: \`${{ job.status }}\`"
            echo ""
            if [ -f artifacts/security/latest/fuzz/run_summary.json ]; then
              python - <<'PY'
          import json
          from pathlib import Path

          summary_path = Path("artifacts/security/latest/fuzz/run_summary.json")
          data = json.loads(summary_path.read_text())
          targets = data.get("targets", [])
          print(f"- Fuzz corpus targets recorded: {len(targets)}")
          execution = data.get("execution", {})
          print("- Fuzz execution status:", data.get("status") or "incomplete")
          print("- Fuzz execution coverage:", execution.get("coverage") or "unknown")
          print("- Internal seconds per target:", execution.get("internal_seconds", "unknown"))
          print("- Watchdog seconds per target:", execution.get("watchdog_seconds", "unknown"))
          for result in execution.get("targets", []):
              build = result.get("build", {})
              run = result.get("run", {})
              print(f"- `{result.get('name')}` build={build.get('status', 'not-run')} "
                    f"run={run.get('status', 'not-run')} exit={run.get('exit_code', 'n/a')}")
          print("- Corpus archive:", data.get("corpus_archive") or "n/a")
          print("- Crash archive :", data.get("crash_archive") or "n/a")
          if targets:
              print("")
              print("### Fuzz Corpus Snapshot")
              for target in targets[:6]:
                  name = target.get("name")
                  files = target.get("files")
                  size_bytes = target.get("size_bytes")
                  print(f"- `{name}` files={files} size={size_bytes}B")
          PY
            else
              echo "- Fuzz run summary not available."
            fi
            echo ""
            echo "### Reference"
            echo "- [Load baseline (auth code flow)](docs/performance/load-baseline-auth-code.md)"
            echo "- [Monitoring runbook](docs/operations/monitoring/README.md)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package security upload
        id: package_security_upload
        if: always()
        env:
          SECURITY_UPLOAD_STAGE: ${{ matrix.stage }}
          SECURITY_UPLOAD_OUTCOME: ${{ steps.run_security_stage.outcome }}
        run: python3 scripts/fuzz/manage_fuzz_corpus.py --package-upload artifacts/security-upload

      - name: Upload security metrics
        if: always() && steps.package_security_upload.outcome == 'success' && matrix.stage != 'sbom'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-${{ matrix.stage }}-${{ github.run_id }}
          if-no-files-found: error
          path: |
            artifacts/security-upload/security-evidence.tar.gz
            artifacts/security-upload/manifest.json

      - name: Upload SBOM metrics
        if: always() && steps.package_security_upload.outcome == 'success' && matrix.stage == 'sbom'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-${{ matrix.stage }}-${{ github.run_id }}
          if-no-files-found: error
          path: |
            artifacts/security-upload/security-evidence.tar.gz
            artifacts/security-upload/manifest.json
