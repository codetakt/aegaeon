name: Infrastructure Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:
    types: [checks_requested]
  workflow_call:
    inputs:
      paths-json:
        description: JSON array of changed infra/tofu paths; empty selects all modules.
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  edit:
    name: Classify infrastructure edit
    if: github.event_name == 'pull_request' && github.event.action == 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      validate: ${{ steps.route.outputs.validate }}
    steps:
      - name: Preserve the native edit before selecting infrastructure checks
        uses: codetakt/aegaeon/.github/actions/record-pr-event@05ab287176ebd82476440ea90a2682f7a5acc4ac
      - name: Identify edits that need infrastructure validation
        id: route
        run: |
          validate=$(jq -r '
            if .action != "edited" then error("expected an edited pull request")
            elif .pull_request.merged == true or .pull_request.base.ref != "main" then false
            elif (.changes | type == "object" and all(.[]; . != null) and
                  (keys | IN(["body"], ["title"], ["body", "title"]))) then false
            else true
            end' "$GITHUB_EVENT_PATH")
          case "$validate" in true|false) echo "validate=$validate" >> "$GITHUB_OUTPUT" ;; *) exit 1 ;; esac

  infrastructure:
    needs: edit
    if: >-
      !cancelled() &&
      ((needs.edit.result == 'skipped' && (github.event_name != 'pull_request' || github.event.action != 'edited')) ||
       (needs.edit.result == 'success' && needs.edit.outputs.validate == 'true'))
    name: OpenTofu modules and template contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Preserve the native PR event for this attempt
        if: github.event_name == 'pull_request'
        uses: codetakt/aegaeon/.github/actions/record-pr-event@05ab287176ebd82476440ea90a2682f7a5acc4ac
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Nix CI
        uses: ./.github/actions/setup-nix-ci
      - name: Check infrastructure runner regressions
        run: |
          nix develop .#integrity --command env PYTHONPATH=scripts/ci python3 -m unittest discover \
            -s tests/ci -p test_infrastructure_validation.py
          nix develop .#integrity --command env PYTHONPATH=scripts/ci python3 -m pytest -q \
            tests/ci/test_perf_delivery_package.py tests/ci/test_perf_runtime_delivery.py \
            tests/ci/test_perf_ssm_sweep.py
      - name: Validate infrastructure inputs
        env:
          INFRASTRUCTURE_PATHS_JSON: ${{ inputs.paths-json }}
        run: |
          args=()
          if [[ -n "$INFRASTRUCTURE_PATHS_JSON" ]]; then
            printf '%s\n' "$INFRASTRUCTURE_PATHS_JSON" > "$RUNNER_TEMP/infrastructure-paths.json"
            args+=(--paths-json "$RUNNER_TEMP/infrastructure-paths.json")
          fi
          nix shell --inputs-from . nixpkgs#opentofu nixpkgs#python3 nixpkgs#bash \
            --command python3 scripts/ci/validate_infrastructure.py "${args[@]}"
      - name: Preserve infrastructure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infrastructure-validation
          path: artifacts/infrastructure-validation
          if-no-files-found: error
