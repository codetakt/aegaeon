name: PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  merge_group:
    branches: [main]
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  plan:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      base: ${{ steps.plan.outputs.base }}
      source_head: ${{ steps.plan.outputs.source_head }}
      test_sha: ${{ steps.plan.outputs.test_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate event, signatures and protected base policy
        id: plan
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$EVENT_BASE_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          if [[ "$GITHUB_EVENT_NAME" == merge_group ]]; then
            # Event base may be a speculative parent; only real main is authority.
            TRUSTED_BASE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            TRUSTED_BASE_SHA="$EVENT_BASE_SHA"
          else
            exit 1
          fi
          [[ "$TRUSTED_BASE_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          export TRUSTED_BASE_SHA
          git fetch --no-tags origin "$TRUSTED_BASE_SHA"
          git merge-base --is-ancestor "$TRUSTED_BASE_SHA" "$GITHUB_SHA"
          trusted="$RUNNER_TEMP/validate_change.py"
          if git cat-file -e "$TRUSTED_BASE_SHA:scripts/ci/validate_change.py"; then
            git show "$TRUSTED_BASE_SHA:scripts/ci/validate_change.py" > "$trusted"
            python3 "$trusted"
          else
            # Installation only: exact base and same-repository branch are checked.
            # Maintainers must also perform the mandatory manual signature gate.
            [[ "$GITHUB_EVENT_NAME" == pull_request ]]
            python3 scripts/ci/validate_change.py --bootstrap
          fi
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-ci-plan
          path: |
            ci-plan.json
            ci-validation.json
          if-no-files-found: error

  docs:
    name: Documentation
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-ci
      - name: Check documentation and PR metadata
        env:
          PR_BASE_SHA: ${{ needs.plan.outputs.base }}
          PR_HEAD_SHA: ${{ needs.plan.outputs.source_head }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: nix develop .#docs --command bash scripts/ci/run_docs.sh

  integrity:
    name: Assurance integrity
    needs: plan
    if: needs.plan.outputs.scope == 'integrity' || needs.plan.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-ci
        with:
          enable-flakehub-cache: "true"
      - name: Validate proof references, claims and FFI contracts
        run: |
          nix build .#verified-reqs .#ffi-contracts --no-link -L
      - name: Check Python validators
        run: |
          nix develop .#integrity --command ruff check scripts/validation scripts/ci/*.py tests/ci ci/validate_slos.py
          nix develop .#integrity --command mypy scripts/validation scripts/ci ci/validate_slos.py

  core:
    needs: plan
    if: needs.plan.outputs.scope == 'full'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci.yml
    with:
      delegate-formal-checks: true

  lint:
    needs: plan
    if: needs.plan.outputs.scope == 'full'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/lint.yml

  security:
    needs: plan
    if: needs.plan.outputs.scope == 'full'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/security.yml

  verification:
    needs: plan
    if: needs.plan.outputs.scope == 'full'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/verification.yml

  compliance:
    needs: plan
    if: needs.plan.outputs.scope == 'full'
    permissions:
      contents: read
      id-token: write
      attestations: write
      # GitHub checks permissions of every nested job, even non-PR jobs.
      security-events: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/compliance.yml

  kms:
    needs: plan
    if: needs.plan.outputs.scope == 'full'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/oidc-kms-parity.yml

  container:
    needs: plan
    if: needs.plan.outputs.scope == 'full'
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/docker-build.yml

  required:
    name: Required checks
    if: ${{ always() }}
    needs: [plan, docs, integrity, core, lint, security, verification, compliance, kms, container]
    runs-on: ubuntu-latest
    steps:
      - name: Require a validated protected base
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BASE_SHA: ${{ needs.plan.outputs.base }}
        run: |
          [[ "$PLAN_RESULT" == success ]]
          [[ "$BASE_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.base }}
          persist-credentials: false
      - name: Require success of every selected check
        env:
          PR_NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          if [ -f scripts/ci/check_pr_results.py ] && [ -f ci/pr-policy.json ]; then
            python3 scripts/ci/check_pr_results.py --policy ci/pr-policy.json
          else
            # First adoption cannot use a checker that is absent from the base.
            # It must succeed in every lane, including all reusable workflows.
            python3 - <<'PY'
          import json
          import os
          needs = json.loads(os.environ['PR_NEEDS_JSON'])
          expected = {'plan', 'docs', 'integrity', 'core', 'lint', 'security',
                      'verification', 'compliance', 'kms', 'container'}
          if (set(needs) != expected or
              needs['plan'].get('outputs', {}).get('scope') != 'full' or
              any(job.get('result') != 'success' for job in needs.values())):
              raise SystemExit('Bootstrap PR requires every check to succeed')
          print('All bootstrap PR checks passed.')
          PY
          fi
