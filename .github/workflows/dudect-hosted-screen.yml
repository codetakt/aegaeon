# A single engineering opportunity. This is not the ordinary PR/main gate.
name: Dudect hosted qualification screen

on:
  push:
    branches: [fix/dudect-hosted-execution]

permissions:
  contents: read

concurrency:
  group: dudect-hosted-qualification
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record opportunity
        run: |
          mkdir -p artifacts/dudect-hosted
          python3 - <<'PY'
          import json, os, pathlib
          keys = ('GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'ImageOS', 'ImageVersion')
          pathlib.Path('artifacts/dudect-hosted/opportunity.json').write_text(
              json.dumps({key: os.environ.get(key) for key in keys}, indent=2) + '\n')
          if os.environ['GITHUB_RUN_ATTEMPT'] != '1':
              raise SystemExit('Replacement attempts are not permitted')
          PY
      - name: Setup Nix
        uses: ./.github/actions/setup-nix-ci
        with:
          free-disk: "true"
          enable-flakehub-cache: "false"
      - name: Build, self-test and freeze all inputs
        timeout-minutes: 60
        run: >-
          python3 -B scripts/ci/prepare_dudect_hosted.py
          --output artifacts/dudect-hosted/preparation
      - name: Execute the fixed 42-case opportunity
        timeout-minutes: 152
        run: |
          exec python3 -B scripts/ci/run_dudect_analysis_matrix.py \
            --plan artifacts/dudect-hosted/preparation/plan.json \
            --plan-sha256 "$(cat artifacts/dudect-hosted/preparation/plan.sha256)" \
            --output artifacts/dudect-hosted/measurement
      - name: Seal complete or partial evidence
        if: ${{ always() }}
        timeout-minutes: 15
        run: >-
          python3 -B scripts/ci/retain_dudect_hosted.py
          --source artifacts/dudect-hosted
          --destination artifacts/dudect-hosted-upload
      - name: Upload evidence even after failure or cancellation
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dudect-hosted-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/dudect-hosted-upload/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
