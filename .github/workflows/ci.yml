# CI: Owns nix flake check, release build, clippy lints, OpenAPI / ABI drift
# checks, and the dependency policy gate (cargo deny).
# cargo audit runs in compliance.yml as the release/compliance security audit.
# EverParse/Low* verification -> verification.yml (everparse-dcr, lowstar-extraction).
# F* verification -> verification.yml (fstar job).
name: CI - Core

on:
  push:
    branches: [ main ]
  workflow_call:
    inputs:
      delegate-formal-checks:
        description: Full PR/group validation owns formal checks in its verification workflow.
        type: boolean
        default: false
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: experimental-features = nix-command flakes
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  ci:
    name: Flake Checks & Build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Nix CI
        uses: ./.github/actions/setup-nix-ci
        with:
          free-disk: "true"
          enable-flakehub-cache: "true"

      - name: Install JavaScript dependencies
        run: nix develop .#ci --command npm ci

      - name: Hook baseline
        run: |
          PRE_COMMIT_HOME=/tmp/pre-commit-aegaeon nix develop .#ci --command pre-commit run --all-files

      - name: Lint commit messages (push)
        if: github.event_name == 'push'
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
              nix develop .#ci --command ./scripts/commitlint-range.sh --to HEAD
            else
              git fetch origin "${{ github.event.repository.default_branch }}" --depth=1
              base_sha="$(git merge-base HEAD "origin/${{ github.event.repository.default_branch }}" || true)"
              nix develop .#ci --command ./scripts/commitlint-range.sh --from "$base_sha" --to HEAD
            fi
          else
            nix develop .#ci --command \
              ./scripts/commitlint-range.sh --from "${{ github.event.before }}" --to "${{ github.sha }}"
          fi

      - name: Lint commit messages (pull_request)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          : "${PR_BASE_SHA:?Pull request base SHA is required}"
          : "${PR_HEAD_SHA:?Pull request head SHA is required}"
          nix develop .#ci --command \
            ./scripts/commitlint-range.sh --from "$PR_BASE_SHA" --to "$PR_HEAD_SHA"

      - name: Lint PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: nix develop .#ci --command bash scripts/ci/lint_pr_title.sh

      - name: Workflow inventory audit
        run: |
          nix develop .#ci --command node --experimental-strip-types \
            scripts/check-workflow-inventory.ts
          nix develop .#ci --command node --experimental-strip-types \
            tests/verified_core_wasm/workflow_inventory_policy_test.ts

      - name: Check OpenAPI artefact drift
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo rm -rf /homeless-shelter || true
          else
            rm -rf /homeless-shelter || true
          fi
          nix develop .#ci --command cargo run --locked --package xtask --bin xtask --features openapi -- openapi --check

      - name: Evaluate all flake outputs and build core-owned checks
        id: core-checks
        env:
          DELEGATE_FORMAL_CHECKS: ${{ inputs.delegate-formal-checks || false }}
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo rm -rf /homeless-shelter || true
          else
            rm -rf /homeless-shelter || true
          fi
          if [ "$DELEGATE_FORMAL_CHECKS" = "true" ]; then
            python3 scripts/ci/run_core_pr_checks.py
          else
            python3 scripts/ci/run_core_pr_checks.py --all-checks
          fi

      - name: Collect original core Dudect gate outputs
        if: ${{ always() && contains(fromJSON('["success", "failure", "cancelled"]'), steps.core-checks.outcome) }}
        run: >-
          python3 scripts/ci/collect_dudect_nix_output.py
          --core-record artifacts/ci-dudect-outputs.json
          --output artifacts/ct/dudect-core-gates

      - name: Preserve core Dudect gate outputs
        if: ${{ always() && contains(fromJSON('["success", "failure", "cancelled"]'), steps.core-checks.outcome) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dudect-core-gate-outputs
          path: |
            artifacts/ci-dudect-outputs.json
            artifacts/ct/dudect-core-gates/
          if-no-files-found: error

      - name: Preserve PR check ownership
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-check-ownership
          path: artifacts/ci-check-ownership.json
          if-no-files-found: warn

      - name: Build release server
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo rm -rf /homeless-shelter || true
          else
            rm -rf /homeless-shelter || true
          fi
          nix build .#server --print-build-logs --out-link result-server
          mkdir -p artifacts
          cp -R --dereference result-server artifacts/server

      - name: Run supplemental clippy lints
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo rm -rf /homeless-shelter || true
          else
            rm -rf /homeless-shelter || true
          fi
          nix build .#lint-supplemental-clippy --no-link -L

      - name: Run server clippy inventory gate
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo rm -rf /homeless-shelter || true
          else
            rm -rf /homeless-shelter || true
          fi
          nix build .#lint-server-clippy-inventory-dev --no-link -L

      # EverParse/Low* artefact verification removed (Phase 9 CI deduplication).
      # Now handled by verification.yml: everparse-dcr + lowstar-extraction jobs.

      - name: Check Verified Core ABI drift
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo rm -rf /homeless-shelter || true
          else
            rm -rf /homeless-shelter || true
          fi
          nix develop .#ci --command bash scripts/validation/check_abi_drift.sh

      - name: Lint Nix, Markdown, and Actions
        run: |
          nix develop .#ci --command bash -c './scripts/lint/lint_nix.sh'
          nix develop .#ci --command bash -c './scripts/lint/lint_markdown.sh'
          nix develop .#ci --command bash -c './scripts/lint/lint_actions.sh'

      - name: Upload server artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server
          path: artifacts/server

  dependency-audit:
    name: Dependency Policy Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix CI
        uses: ./.github/actions/setup-nix-ci
        with:
          free-disk: "true"
          enable-flakehub-cache: "true"

      - name: Check dependency policies (licenses, bans, sources, advisories)
        run: nix develop .#ci --command cargo deny check

  db-integration:
    name: DB Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix CI
        uses: ./.github/actions/setup-nix-ci
        with:
          free-disk: "true"
          enable-flakehub-cache: "true"

      - name: Run DB-gated ignored integration tests
        env:
          AEGAEON_SERVER_CONTAINER_DOWN: "1"
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo rm -rf /homeless-shelter || true
          else
            rm -rf /homeless-shelter || true
          fi
          nix develop .#ci --command ./scripts/tests/run_server_container_integration.sh all

      - name: Run client JWKS tests in an isolated network namespace
        run: |
          nix develop .#ci --command python3 scripts/validation/test_client_jwks_cache.py --sudo-netns

      - name: Run JWKS fingerprint tests in an isolated network namespace
        run: |
          nix develop .#ci --command python3 scripts/validation/test_jwks_fingerprint_ledger.py --sudo-netns

      - name: Compare Redis grant traces with F* fixtures
        run: |
          nix develop .#ci --command python3 scripts/validation/check_authcode_redis_grant.py \
            --out-dir artifacts/authcode-redis-correspondence

      - name: Upload Redis grant correspondence records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authcode-redis-correspondence
          path: artifacts/authcode-redis-correspondence/
          if-no-files-found: error
