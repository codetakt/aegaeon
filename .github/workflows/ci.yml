# CI: Owns nix flake check, release build, clippy lints, OpenAPI / ABI drift
# checks, and the dependency policy gate (cargo deny).
# cargo audit runs in compliance.yml as the release/compliance security audit.
# EverParse/Low* verification -> verification.yml (everparse-dcr, lowstar-extraction).
# F* verification -> verification.yml (fstar job).
name: CI - Core

on:
  push:
    branches: [ main ]
  workflow_call:
    inputs:
      delegate-formal-checks:
        description: Full PR/group validation owns formal checks in its verification workflow.
        type: boolean
        default: false
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: experimental-features = nix-command flakes
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  ci:
    name: Flake Checks & Build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Start disk capacity observation
        continue-on-error: true
        run: |
          python3 scripts/ci/observe_disk_capacity.py start "$RUNNER_TEMP/core-disk-capacity" \
            --paths "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /nix

      - name: Setup Nix CI
        uses: ./.github/actions/setup-nix-ci
        with:
          # Concurrent Rust derivations exhausted swap before runner shutdown.
          # Keep each derivation's CPU allocation; serialize independent builds.
          extra-conf: |
            experimental-features = nix-command flakes
            max-jobs = 1
          free-disk: "true"
          minimum-free-gib: ${{ inputs.delegate-formal-checks && '80' || '0' }}
          enable-flakehub-cache: "true"

      - name: Install JavaScript dependencies
        run: nix develop .#ci-tools --command npm ci

      - name: Hook baseline
        run: |
          PRE_COMMIT_HOME=/tmp/pre-commit-aegaeon nix develop .#ci-tools --command pre-commit run --all-files

      - name: Lint commit messages (push)
        if: github.event_name == 'push'
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
              nix develop .#ci-tools --command ./scripts/commitlint-range.sh --to HEAD
            else
              git fetch origin "${{ github.event.repository.default_branch }}" --depth=1
              base_sha="$(git merge-base HEAD "origin/${{ github.event.repository.default_branch }}" || true)"
              nix develop .#ci-tools --command ./scripts/commitlint-range.sh --from "$base_sha" --to HEAD
            fi
          else
            nix develop .#ci-tools --command \
              ./scripts/commitlint-range.sh --from "${{ github.event.before }}" --to "${{ github.sha }}"
          fi

      - name: Lint commit messages (pull_request)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          : "${PR_BASE_SHA:?Pull request base SHA is required}"
          : "${PR_HEAD_SHA:?Pull request head SHA is required}"
          nix develop .#ci-tools --command \
            ./scripts/commitlint-range.sh --from "$PR_BASE_SHA" --to "$PR_HEAD_SHA"

      - name: Lint PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: nix develop .#ci-tools --command bash scripts/ci/lint_pr_title.sh

      - name: Workflow inventory audit
        run: |
          nix develop .#ci-tools --command node --experimental-strip-types \
            scripts/check-workflow-inventory.ts
          nix develop .#ci-tools --command node --experimental-strip-types \
            tests/verified_core_wasm/workflow_inventory_policy_test.ts

      - name: Check OpenAPI artefact drift
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo rm -rf /homeless-shelter || true
          else
            rm -rf /homeless-shelter || true
          fi
          nix build .#openapi-check --no-link --print-build-logs

      - name: Observe local Nix cache inputs before the core build
        timeout-minutes: 2
        run: |
          python3 scripts/ci/observe_nix_cache_inputs.py --role core \
            --output artifacts/nix-cache-inputs-core.json

      - name: Evaluate all flake outputs and build core-owned checks
        id: core-checks
        env:
          DELEGATE_FORMAL_CHECKS: ${{ inputs.delegate-formal-checks || false }}
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo rm -rf /homeless-shelter || true
          else
            rm -rf /homeless-shelter || true
          fi
          if [ "$DELEGATE_FORMAL_CHECKS" = "true" ]; then
            python3 scripts/ci/with_organization_userns.py --report artifacts/organization-userns-core.json -- \
              python3 scripts/ci/run_core_pr_checks.py
          else
            python3 scripts/ci/with_organization_userns.py --report artifacts/organization-userns-core.json -- \
              python3 scripts/ci/run_core_pr_checks.py --all-checks
          fi

      - name: Preserve PR check ownership
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-check-ownership
          path: |
            artifacts/ci-check-ownership.json
            artifacts/core-build-observations.jsonl
            artifacts/organization-userns-core.json
            artifacts/nix-cache-inputs-core.json
          if-no-files-found: warn

      - name: Build release server
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo rm -rf /homeless-shelter || true
          else
            rm -rf /homeless-shelter || true
          fi
          nix build .#server --print-build-logs --out-link result-server
          mkdir -p artifacts
          cp -R --dereference result-server artifacts/server

      - name: Run supplemental clippy lints
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo rm -rf /homeless-shelter || true
          else
            rm -rf /homeless-shelter || true
          fi
          nix build .#lint-supplemental-clippy --no-link -L

      - name: Run server clippy inventory gate
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo rm -rf /homeless-shelter || true
          else
            rm -rf /homeless-shelter || true
          fi
          nix build .#lint-server-clippy-inventory-dev --no-link -L

      # EverParse/Low* artefact verification removed (Phase 9 CI deduplication).
      # Now handled by verification.yml: everparse-dcr + lowstar-extraction jobs.

      - name: Check Verified Core ABI drift
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo rm -rf /homeless-shelter || true
          else
            rm -rf /homeless-shelter || true
          fi
          nix develop .#ci-tools --command bash scripts/validation/check_abi_drift.sh

      - name: Lint Nix, Markdown, and Actions
        run: |
          nix develop .#ci-tools --command bash -c './scripts/lint/lint_nix.sh'
          nix develop .#ci-tools --command bash -c './scripts/lint/lint_markdown.sh'
          nix develop .#ci-tools --command bash -c './scripts/lint/lint_actions.sh'

      - name: Validate real AppArmor and Nix cancellation lifecycles
        timeout-minutes: 8
        run: python3 -B tests/organizations/namespace_lifecycle.py --output artifacts/organizations-namespace-lifecycle

      - name: Preserve real namespace lifecycle evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: organizations-namespace-lifecycle
          path: artifacts/organizations-namespace-lifecycle
          if-no-files-found: error

      - name: Upload server artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server
          path: artifacts/server

      - name: Stop disk capacity observation
        continue-on-error: true
        if: always()
        run: python3 scripts/ci/observe_disk_capacity.py stop "$RUNNER_TEMP/core-disk-capacity"

      - name: Preserve disk capacity samples
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-disk-capacity
          path: ${{ runner.temp }}/core-disk-capacity/
          if-no-files-found: error

  dependency-audit:
    name: Dependency Policy Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix CI
        uses: ./.github/actions/setup-nix-ci
        with:
          free-disk: "true"
          # Retain cleanup when any relevant filesystem is below 80 GiB or unreadable.
          minimum-free-gib: "80"
          enable-flakehub-cache: "true"

      - name: Check dependency policies (licenses, bans, sources, advisories)
        run: nix develop .#ci --command cargo deny check

      - name: Observe remaining disk capacity
        if: always()
        run: |
          echo "Disk capacity after checks; peak usage was not measured."
          df -B1 -- "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /nix || true

  db-integration:
    name: DB Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AEGAEON_DATABASE_EXECUTION_PLAN: ${{ github.workspace }}/artifacts/database-execution/plan.json
      AEGAEON_DATABASE_EXECUTION_RESULTS: ${{ github.workspace }}/artifacts/database-execution/results
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix CI
        uses: ./.github/actions/setup-nix-ci
        with:
          free-disk: "true"
          enable-flakehub-cache: "true"

      - name: Run DB-gated ignored integration tests
        id: database-tests
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo rm -rf /homeless-shelter || true
          else
            rm -rf /homeless-shelter || true
          fi
          AEGAEON_DATABASE_TEST_PACKAGE=$(nix build .#database-tests --no-link --print-out-paths)
          test -n "$AEGAEON_DATABASE_TEST_PACKAGE"
          printf 'package=%s\n' "$AEGAEON_DATABASE_TEST_PACKAGE" >> "$GITHUB_OUTPUT"
          export AEGAEON_DATABASE_TEST_PACKAGE
          python3 scripts/ci/observe_nix_cache_inputs.py --role database \
            --package "$AEGAEON_DATABASE_TEST_PACKAGE" \
            --output artifacts/database-execution/nix-cache-inputs.json
          python3 scripts/validation/database_execution.py discover --package "$AEGAEON_DATABASE_TEST_PACKAGE"
          nix develop .#ci --command python3 scripts/ci/run_database_lanes.py

      - name: Validate real database supplier cleanup under cancellation and lost receipts
        timeout-minutes: 12
        run: |
          nix develop .#ci --command python3 tests/ci/check_database_supplier_cleanup.py \
            --root "$GITHUB_WORKSPACE" --plan "$AEGAEON_DATABASE_EXECUTION_PLAN" \
            --output "$GITHUB_WORKSPACE/artifacts/database-supplier-lifecycle"

      - name: Run Organizations SQL upgrades, ownership transitions and conditional models
        run: |
          python3 scripts/validation/database_execution.py run --name models

      - name: Run Organizations current-generation startup on isolated PostgreSQL
        run: |
          python3 scripts/validation/database_execution.py run --name production
          runtime_output=$(nix eval --raw .#checks.x86_64-linux.organizations-production-runtime.outPath)
          cp "$runtime_output/cleanup.json" artifacts/database-supplier-lifecycle/postgres.json

      - name: Validate real PostgreSQL cleanup on this runner
        timeout-minutes: 4
        run: |
          sha256sum tests/organizations/check_current_runtime_postgres.py \
            tests/organizations/current_runtime.py tests/organizations/current_process.py \
            tests/organizations/current_postgres.py \
            scripts/validation/database_execution.py scripts/validation/database_test_package.py \
            scripts/validation/jose_server_test_package.py \
            > artifacts/database-supplier-lifecycle/postgres-live-source.sha256
          # Resolve pg_ctl inside the pinned Nix environment.
          postgres_check_status=0
          # shellcheck disable=SC2016
          nix shell --inputs-from . nixpkgs#postgresql_18 nixpkgs#python3 nixpkgs#bash \
            --command bash -euo pipefail -c '
              python3 tests/organizations/check_current_runtime_postgres.py \
                --root "$GITHUB_WORKSPACE" --postgres-bin "$(dirname "$(command -v pg_ctl)")" \
                --output "$GITHUB_WORKSPACE/artifacts/database-supplier-lifecycle/postgres-live"
            ' || postgres_check_status=$?
          postgres_hash_status=0
          sha256sum --check artifacts/database-supplier-lifecycle/postgres-live-source.sha256 \
            || postgres_hash_status=$?
          if [ "$postgres_check_status" -ne 0 ]; then
            exit "$postgres_check_status"
          fi
          exit "$postgres_hash_status"

      - name: Preserve database supplier lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-supplier-lifecycle
          path: artifacts/database-supplier-lifecycle/
          if-no-files-found: error

      - name: Upload Organizations namespace qualification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: organizations-namespace-db
          path: artifacts/organization-userns-db.json
          if-no-files-found: warn

      - name: Run Organizations current-generation recovery and shutdown validation
        timeout-minutes: 15
        run: |
          python3 scripts/validation/database_execution.py run --name recovery

      - name: Upload Organizations recovery results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: organizations-recovery-results
          path: |
            ${{ runner.temp }}/aegaeon-recovery-${{ github.run_id }}-${{ github.run_attempt }}/**/*result.json
            ${{ runner.temp }}/aegaeon-recovery-${{ github.run_id }}-${{ github.run_attempt }}/negative-source.json
          if-no-files-found: warn

      - name: Run client JWKS tests in an isolated network namespace
        run: python3 scripts/validation/database_execution.py run --name jwks

      - name: Run JWKS fingerprint tests in an isolated network namespace
        run: python3 scripts/validation/database_execution.py run --name fingerprint

      - name: Compare Redis grant traces with F* fixtures
        run: |
          python3 scripts/validation/database_execution.py run --name grant

      - name: Upload Redis grant correspondence records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: authcode-redis-correspondence
          path: artifacts/authcode-redis-correspondence/
          if-no-files-found: error

      - name: Require complete database execution inventory and supplier cleanup
        if: always()
        run: |
          python3 scripts/validation/database_execution.py aggregate \
            --output artifacts/database-execution/aggregate.json

      - name: Preserve database execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-execution
          path: artifacts/database-execution/
          if-no-files-found: error
