name: Build and Push OCI Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_call:
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: experimental-features = nix-command flakes
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push OCI Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      PUBLISH_MAIN_IMAGE: >-
        ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
            github.ref == 'refs/heads/main' }}
    steps:
      - name: Hold versioned container publication until external qualification is commissioned
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error::Release qualification is pending. Hosted functional checks and historical timing results cannot authorize this release artifact."
          exit 1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix CI
        uses: ./.github/actions/setup-nix-ci
        with:
          free-disk: "true"
          enable-flakehub-cache: ${{ env.PUBLISH_MAIN_IMAGE != 'true' && github.event_name != 'workflow_dispatch' }}

      - name: Build OCI image (Nix)
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo rm -rf /homeless-shelter || true
          else
            rm -rf /homeless-shelter || true
          fi
          # Manual builds on a topic branch qualify the publication archive through Docker load.
          if [[ "$PUBLISH_MAIN_IMAGE" == true || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            bash scripts/ci/build_publishable_oci.sh
          else
            nix build .#docker-image --print-build-logs
          fi

      - name: Load image into Docker
        run: |
          gzip -dc result | docker load

      - name: Check the imported publication image
        if: env.PUBLISH_MAIN_IMAGE == 'true' || github.event_name == 'workflow_dispatch'
        run: bash scripts/ci/verify_imported_oci.sh

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH_MAIN_IMAGE == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/aegaeon-server
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Tag and push OCI image
        if: env.PUBLISH_MAIN_IMAGE == 'true'
        run: |
          set -euo pipefail
          SRC_IMAGE="aegaeon:latest"
          tags="${{ steps.meta.outputs.tags }}"
          if [[ -z "${tags}" ]]; then
            echo "docker/metadata-action produced no tags" >&2
            exit 1
          fi

          while IFS= read -r tag; do
            [[ -n "${tag}" ]] || continue
            docker tag "${SRC_IMAGE}" "${tag}"
            docker push "${tag}"
          done <<<"${tags}"

      - name: Output image info
        if: env.PUBLISH_MAIN_IMAGE == 'true'
        run: |
          echo "Image pushed to: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/aegaeon-server"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
