name: OIDC KMS Signing Parity

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oidc-kms-parity-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  oidc-kms-parity:
    name: OIDC AWS KMS Parity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    services:
      localstack:
        image: localstack/localstack:3.4
        ports:
          - 4566:4566
        env:
          SERVICES: kms
          GATEWAY_LISTEN: "0.0.0.0:4566"
          AWS_DEFAULT_REGION: us-east-1
          EAGER_SERVICE_LOADING: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix CI
        uses: ./.github/actions/setup-nix-ci
        with:
          free-disk: "true"
          minimum-free-gib: "80"
          enable-flakehub-cache: "true"

      - name: Run OIDC AWS KMS parity lane
        run: |
          nix develop .#ci --command bash scripts/validation/run_oidc_kms_parity.sh

      - name: Upload OIDC KMS parity artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oidc-kms-parity
          path: artifacts/oidc-kms/
          if-no-files-found: warn

      - name: Observe final disk capacity
        if: always()
        run: |
          echo "Final disk capacity; peak usage was not measured."
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /nix || true

