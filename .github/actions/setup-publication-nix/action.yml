name: Set up Nix for attested and signed builds
description: Start with a fresh hosted store and admit only signed upstream substitutes.
inputs:
  free-disk:
    description: Run the existing hosted disk cleanup before installation.
    default: "false"
runs:
  using: composite
  steps:
    - name: Require a fresh runner store
      shell: bash
      run: |
        if [[ -e /nix/store || -L /nix/store ]]; then
          echo 'Publication inputs require a fresh Nix store.' >&2
          exit 1
        fi
    - name: Free disk space on the hosted runner
      if: inputs.free-disk == 'true'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../setup-nix-ci/prepare-disk.sh" 0 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /nix
    - name: Install upstream Nix with the publication policy
      shell: bash
      run: |
        set -euo pipefail
        stage=$(mktemp -d "$RUNNER_TEMP/publication-nix.XXXXXXXX")
        trap 'rm -rf -- "$stage"' EXIT
        cd "$stage"
        archive=nix-2.34.9-x86_64-linux.tar.xz
        curl --fail --silent --show-error --location --proto '=https' \
          "https://releases.nixos.org/nix/nix-2.34.9/$archive" --output "$archive"
        printf '%s  %s\n' e8912e087582b3799e0e5a6b06f9d63386c54821f77ad4de3b9b748736ad364e "$archive" | sha256sum --check
        tar -xJf "$archive"
        "./${archive%.tar.xz}/install" --daemon --yes --no-channel-add --no-modify-profile \
          --nix-extra-conf-file "$GITHUB_ACTION_PATH/nix.conf"
        echo '/nix/var/nix/profiles/default/bin' >> "$GITHUB_PATH"
        if [[ -d /homeless-shelter ]]; then sudo rmdir /homeless-shelter; fi
    - name: Verify the effective build input policy
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/verify.sh"
