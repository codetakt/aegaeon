name: Setup Nix CI
description: Standardize Nix setup, runner cleanup, and binary cache enablement.

inputs:
  extra-conf:
    description: Additional nix.conf content for the installer.
    required: false
    default: experimental-features = nix-command flakes
  free-disk:
    description: Run the hosted-runner disk cleanup step.
    required: false
    default: "false"
  minimum-free-gib:
    description: Skip enabled cleanup only when every relevant filesystem has this much free space; zero always cleans.
    required: false
    default: "0"
  enable-flakehub-cache:
    description: Enable the FlakeHub binary cache.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Free disk space (GitHub hosted runner)
      if: ${{ inputs.free-disk == 'true' }}
      shell: bash
      env:
        MINIMUM_FREE_GIB: ${{ inputs.minimum-free-gib }}
      run: |
        bash "$GITHUB_ACTION_PATH/prepare-disk.sh" "$MINIMUM_FREE_GIB" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /nix

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      with:
        extra-conf: ${{ inputs.extra-conf }}
        github-token: ${{ github.token }}

    - name: Remove /homeless-shelter (Nix purity)
      shell: bash
      run: |
        if command -v sudo >/dev/null 2>&1; then
          sudo rm -rf /homeless-shelter || true
        else
          rm -rf /homeless-shelter || true
        fi

    - name: Enable FlakeHub cache
      if: ${{ inputs.enable-flakehub-cache == 'true' }}
      uses: DeterminateSystems/flakehub-cache-action@88740a21e786360ba66bdd8fecabcbf852db3a5a # v3.23.0
